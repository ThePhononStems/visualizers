<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Blend Projector</title>
<style>
*{
  box-sizing:border-box;
}
html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:#111;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

/* ============================================================
   The photo sequences are no longer listed in this file.
   Add or remove photos by editing:
     photos/list.txt    (one filename per line, Layer A)
     photosB/list.txt   (one filename per line, Layer B)
     photosC/list.txt   (optional, one filename per line, Layer C)
   Blank lines and lines starting with # are ignored.
   Layer C is optional -- if photosC/list.txt doesn't exist,
   the page still works fine with just Layer A and Layer B.
   ============================================================ */
</style>

<body>

<div class="wrap">
  <div class="stage" id="stage">
    <div class="stageInner" id="stageInner">
      <div class="layer" id="layerA">
        <img class="sub" id="imgA">
      </div>
      <div class="layer" id="layerB">

      </div>

      </div>

    <div class="flash" id="flash"></div>
  </div>

  <div class="controls">
    <label class="ctrlLabel toggleLabel">
      <input type="checkbox" id="layerAToggle" checked>
      Layer A
    </label>
    <button id="skipBackA" class="btn btnSmall">&#9664;</button>

    </label>
    <button id="skipBackB" class="btn btnSmall">&#9664;</button>
    <button id="skipFwdB" class="btn btnSmall">&#9654;</button>

  <div class="controls urlRow">

    <button id="urlLoadA" class="btn btnSmall">Load</button>

    <button id="urlLoadB" class="btn btnSmall">Load</button>

  <div class="controls urlRow">
    <span class="ctrlLabel urlLabel">Layer C album:</span>
    <input type="text" id="urlInputC" class="urlInput" placeholder="Paste a flickr.com/photos/.../albums/... URL">
    <button id="urlLoadC" class="btn btnSmall">Load</button>
    <button id="urlClearC" class="btn btnSmall">Clear</button>
    <button id="uploadBtnC" class="btn btnSmall">Upload your own photos</button>
    <input type="file" id="uploadInputC" accept="image/*" multiple style="display:none;">
  </div>

  <div class="controls">
    <label class="ctrlLabel" for="blendSelect">Blend mode</label>
    <select id="blendSelect">
      <option value="overlay">Overlay</option>

      <option value="screen">Screen</option>

      <option value="hard-light">Hard light</option>
      <option value="vivid-light">Vivid light (approx.)</option>

<script>
/* ============================================================
   Default sources for each layer. These are only used the
   first time the page loads -- once you paste an album URL
   into the box on the page itself, that choice is saved in
   the browser and used from then on, overriding this.
   ============================================================ */
const FLICKR_API_KEY = "93e2c36e6750f5f66de8c917ce5b5db0";
const LAYER_SOURCES = {
  A: { type: "local", manifest: "photos/list.txt", folder: "photos/" },
  B: { type: "local", manifest: "photosB/list.txt", folder: "photosB/" },
  C: { type: "local", manifest: "photosC/list.txt", folder: "photosC/" }
};

const INTERVAL_MS = 2000;
const BLEND_CYCLE_MODES = ["overlay", "multiply", "vivid-light", "color-dodge", "color-burn", "exclusion", "difference", "hard-light", "screen", "soft-light", "lighter-color", "pin-light"];
const BLEND_CYCLE_STEP_MS = 2000;

const stage = document.getElementById("stage");
const stageInner = document.getElementById("stageInner");
const layerA = document.getElementById("layerA");
const layerB = document.getElementById("layerB");
const layerC = document.getElementById("layerC");
const blendSelect = document.getElementById("blendSelect");
const blendCycleToggle = document.getElementById("blendCycleToggle");
const autoBalance = document.getElementById("autoBalance");
const compareToggle = document.getElementById("compareToggle");
const compareButtons = document.getElementById("compareButtons");
const preBtn = document.getElementById("preBtn");
const postBtn = document.getElementById("postBtn");
const fullResToggle = document.getElementById("fullResToggle");
const cropToggle = document.getElementById("cropToggle");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const newTabLink = document.getElementById("newTabLink");
newTabLink.href = window.location.href;
const imgAEl = document.getElementById("imgA");
const imgBEl = document.getElementById("imgB");
const imgCEl = document.getElementById("imgC");
const flash = document.getElementById("flash");
const logEl = document.getElementById("sheet");
const captureCountEl = document.getElementById("captureCount");

const layerAToggle = document.getElementById("layerAToggle");
const layerBToggle = document.getElementById("layerBToggle");
const layerCToggle = document.getElementById("layerCToggle");
const layerCLabel = document.getElementById("layerCLabel");
const skipBackA = document.getElementById("skipBackA");
const skipFwdA = document.getElementById("skipFwdA");
const skipBackB = document.getElementById("skipBackB");
const skipFwdB = document.getElementById("skipFwdB");
const skipBackC = document.getElementById("skipBackC");
const skipFwdC = document.getElementById("skipFwdC");

let getCurrentA = function(){ return ""; };
let getCurrentB = function(){ return ""; };
let getCurrentC = function(){ return ""; };
let cyclerA = null;
let cyclerB = null;
let cyclerC = null;

function applyCropClass(){
  imgAEl.classList.toggle("cropFill", cropToggle.checked);
  imgBEl.classList.toggle("cropFill", cropToggle.checked);
  imgCEl.classList.toggle("cropFill", cropToggle.checked);
}
cropToggle.addEventListener("change", applyCropClass);
applyCropClass();

function toggleFullscreen(){
  const fsElement = document.fullscreenElement || document.webkitFullscreenElement;
  if (!fsElement) {
    const request = stage.requestFullscreen ? stage.requestFullscreen() : (stage.webkitRequestFullscreen ? stage.webkitRequestFullscreen() : null);
    if (request && request.catch) {
      request.catch(function(){
        alert("Fullscreen isn't allowed inside this embedded view. Use \"Open in new tab\" instead, then Fullscreen will work normally.");
      });
    }
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
  }
}

fullscreenBtn.addEventListener("click", toggleFullscreen);
stage.addEventListener("dblclick", toggleFullscreen);

if (document.fullscreenEnabled === false) {
  fullscreenBtn.textContent = "Fullscreen unavailable here";
  fullscreenBtn.disabled = true;
}

function updateFullscreenLabel(){
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  fullscreenBtn.textContent = isFs ? "Exit fullscreen" : "Fullscreen";
}
document.addEventListener("fullscreenchange", updateFullscreenLabel);
document.addEventListener("webkitfullscreenchange", updateFullscreenLabel);

let currentBlendValue = blendSelect.value;

/* Maps approximated Photoshop-only modes to the closest real
   browser/canvas blend mode. Used for both the live CSS view
   and the exported canvas capture, so they always match. */
function canvasBlendName(v){
  if (v === "vivid-light") return "hard-light";
  if (v === "pin-light") return "overlay";
  if (v === "lighter-color") return "lighten";
  return v;
}

function updateLayerStack(){
  const candidates = [
    { el: layerA, enabled: layerAToggle.checked },
    { el: layerB, enabled: layerBToggle.checked },
    { el: layerC, enabled: layerCToggle.checked && !!cyclerC }
  ];
  let first = true;
  candidates.forEach(function(item){
    if (item.enabled) {
      item.el.style.display = "block";
      item.el.style.mixBlendMode = first ? "normal" : canvasBlendName(currentBlendValue);
      first = false;
    } else {
      item.el.style.display = "none";
    }
  });
}

function setBlendMode(value){
  currentBlendValue = value;
  blendSelect.value = value;
  updateLayerStack();
}
setBlendMode(currentBlendValue);

async function loadManifest(path, folder){
  const res = await fetch(path);
  if (!res.ok) {
    throw new Error("Could not load " + path);
  }
  const text = await res.text();
  return text.split("\n")
    .map(function(line){ return line.trim(); })
    .filter(function(line){ return line.length > 0 && line[0] !== "#"; })
    .map(function(name){ return folder + name; });
}

function flickrJsonp(url){
  return new Promise(function(resolve, reject){
    const callbackName = "flickrCb_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    let settled = false;

    window[callbackName] = function(data){
      settled = true;
      resolve(data);
      delete window[callbackName];
      script.remove();
    };

    script.src = url + "&format=json&jsoncallback=" + callbackName;
    script.onerror = function(){
      if (!settled) reject(new Error("Flickr request failed to load"));
      delete window[callbackName];
      script.remove();
    };
    setTimeout(function(){
      if (!settled) reject(new Error("Flickr request timed out"));
    }, 10000);
    document.body.appendChild(script);
  });
}

async function resolveUserId(apiKey, userIdOrUsername){
  if (/^\d+@N\d+$/.test(userIdOrUsername)) {
    return userIdOrUsername;
  }
  const profileUrl = "https://www.flickr.com/photos/" + encodeURIComponent(userIdOrUsername) + "/";
  const url = "https://api.flickr.com/services/rest/?method=flickr.urls.lookupUser"
    + "&api_key=" + encodeURIComponent(apiKey)
    + "&url=" + encodeURIComponent(profileUrl);
  const data = await flickrJsonp(url);
  if (data.stat !== "ok") {
    throw new Error("Could not resolve Flickr profile '" + userIdOrUsername + "': " + (data.message || data.stat));
  }
  return data.user.id;
}

async function loadFlickrAlbum(cfg){
  const userId = await resolveUserId(cfg.apiKey, cfg.userId);
  const perPage = 500;
  let allPhotos = [];
  let page = 1;
  let totalPages = 1;

  do {
    const url = "https://api.flickr.com/services/rest/?method=flickr.photosets.getPhotos"
      + "&api_key=" + encodeURIComponent(cfg.apiKey)
      + "&photoset_id=" + encodeURIComponent(cfg.photosetId)
      + "&user_id=" + encodeURIComponent(userId)
      + "&per_page=" + perPage
      + "&page=" + page
      + "&extras=url_o,url_l,url_c,url_z,url_m";
    const data = await flickrJsonp(url);
    if (data.stat !== "ok") {
      throw new Error("Flickr API error: " + (data.message || data.stat));
    }
    allPhotos = allPhotos.concat(data.photoset.photo);
    totalPages = data.photoset.pages;
    page++;
  } while (page <= totalPages);

  return allPhotos
    .map(function(p){
      return p.url_o || p.url_l || p.url_c || p.url_z || p.url_m;
    })
    .filter(Boolean)
    .map(function(url){
      return url.indexOf("http") === 0 ? url : "https:" + url;
    });
}

async function loadFlickrPage(cfg){
  const perPage = cfg.perPage || 100;
  const userId = await resolveUserId(cfg.apiKey, cfg.userId);
  const url = "https://api.flickr.com/services/rest/?method=flickr.people.getPublicPhotos"
    + "&api_key=" + encodeURIComponent(cfg.apiKey)
    + "&user_id=" + encodeURIComponent(userId)
    + "&page=" + encodeURIComponent(cfg.page)
    + "&per_page=" + encodeURIComponent(perPage)
    + "&extras=url_o,url_l,url_c,url_z,url_m";
  const data = await flickrJsonp(url);
  if (data.stat !== "ok") {
    throw new Error("Flickr API error: " + (data.message || data.stat));
  }
  return data.photos.photo
    .map(function(p){
      return p.url_o || p.url_l || p.url_c || p.url_z || p.url_m;
    })
    .filter(Boolean)
    .map(function(url){
      return url.indexOf("http") === 0 ? url : "https:" + url;
    });
}

function loadLayerSource(cfg){
  if (cfg.type === "flickr") {
    return loadFlickrAlbum(cfg);
  }
  if (cfg.type === "flickr-page") {
    return loadFlickrPage(cfg);
  }
  return loadManifest(cfg.manifest, cfg.folder);
}

function parseFlickrAlbumUrl(text){
  const m = text.match(/flickr\.com\/photos\/([^\/\s]+)\/albums\/(\d+)/);
  if (!m) return null;
  return { userId: m[1], photosetId: m[2] };
}

const URL_STORAGE_PREFIX = "blendLayerAlbumUrl_";

function savedAlbumUrl(key){
  return localStorage.getItem(URL_STORAGE_PREFIX + key) || "";
}

function applyLayerList(key, list){
  const imgId = "img" + key;
  const cycler = makeCycler(imgId, list);
  if (key === "A") { cyclerA = cycler; getCurrentA = cycler.getCurrent; }
  if (key === "B") { cyclerB = cycler; getCurrentB = cycler.getCurrent; }
  if (key === "C") {
    cyclerC = cycler;
    getCurrentC = cycler.getCurrent;
    layerCToggle.disabled = false;
    layerCLabel.classList.remove("disabledLabel");
    skipBackC.disabled = false;
    skipFwdC.disabled = false;
  }
  updateLayerStack();
  scheduleAnalysisNow();
}

async function switchLayerToAlbumUrl(key, rawUrl){
  const parsed = parseFlickrAlbumUrl(rawUrl);
  if (!parsed) {
    alert("That doesn't look like a Flickr album URL. Expected something like:\nflickr.com/photos/username/albums/72177720123456789");
    return;
  }
  const cfg = { type: "flickr", apiKey: FLICKR_API_KEY, userId: parsed.userId, photosetId: parsed.photosetId };
  try {
    const list = await loadLayerSource(cfg);
    if (list.length === 0) {
      alert("That album returned no photos.");
      return;
    }
    applyLayerList(key, list);
    localStorage.setItem(URL_STORAGE_PREFIX + key, rawUrl);
  } catch (err) {
    alert("Could not load that album: " + err.message);
  }
}

function wireUploadInput(key){
  const btn = document.getElementById("uploadBtn" + key);
  const input = document.getElementById("uploadInput" + key);
  btn.addEventListener("click", function(){ input.click(); });
  input.addEventListener("change", function(){
    const files = Array.from(input.files || []).filter(function(f){
      return f.type.indexOf("image/") === 0;
    });
    if (files.length === 0) return;
    const list = files.map(function(f){ return URL.createObjectURL(f); });
    applyLayerList(key, list);
  });
}
wireUploadInput("A");
wireUploadInput("B");
wireUploadInput("C");

function wireUrlInput(key){
  const input = document.getElementById("urlInput" + key);
  const btn = document.getElementById("urlLoad" + key);
  const clearBtn = document.getElementById("urlClear" + key);
  const toggle = document.getElementById("layer" + key + "Toggle");
  const saved = savedAlbumUrl(key);
  if (saved) input.value = saved;

  function submit(){
    const val = input.value.trim();
    if (val) switchLayerToAlbumUrl(key, val);
  }
  btn.addEventListener("click", submit);
  input.addEventListener("keydown", function(e){
    if (e.key === "Enter") submit();
    e.stopPropagation();
  });
  clearBtn.addEventListener("click", async function(){
    input.value = "";
    localStorage.removeItem(URL_STORAGE_PREFIX + key);
    toggle.checked = true;
    toggle.disabled = false;
    if (key === "C") {
      layerCLabel.classList.remove("disabledLabel");
      skipBackC.disabled = false;
      skipFwdC.disabled = false;
    }
    try {
      const list = await loadLayerSource(LAYER_SOURCES[key]);
      if (list.length > 0) {
        applyLayerList(key, list);
      } else {
        alert("The default source for Layer " + key + " returned no photos.");
      }
    } catch (err) {
      alert("Could not reload the default images for Layer " + key + ": " + err.message);
    }
  });
}
wireUrlInput("A");
wireUrlInput("B");
wireUrlInput("C");

function makeCycler(id, list){
  const el = document.getElementById(id);
  let index = 0;
  let current = list[0];

  function preload(src){
    const img = new Image();
    img.src = src;
  }

  el.src = list[0];
  preload(list[1 % list.length]);

  function advance(){
    index = (index + 1) % list.length;
    current = list[index];
    el.src = current;
    preload(list[(index + 1) % list.length]);
  }

  function back(){
    index = (index - 1 + list.length) % list.length;
    current = list[index];
    el.src = current;
    preload(list[(index + 1) % list.length]);
  }

  return { advance: advance, back: back, getCurrent: function(){ return current; } };
}

let mode = "normal";
let paused = false;
let mainTimerId = null;
let blendCycleIndex = 0;

function stopTimer(){
  clearInterval(mainTimerId);
  mainTimerId = null;
}

function startNormalMode(){
  stopTimer();
  if (paused || !cyclerA) return;
  mainTimerId = setInterval(function(){
    cyclerA.advance();
    cyclerB.advance();
    if (cyclerC) cyclerC.advance();
    scheduleAnalysis();
  }, INTERVAL_MS);
}

function startBlendCycleMode(){
  stopTimer();
  if (paused || !cyclerA) return;
  blendCycleIndex = 0;
  setBlendMode(BLEND_CYCLE_MODES[blendCycleIndex]);
  scheduleAnalysis();
  mainTimerId = setInterval(function(){
    blendCycleIndex++;
    if (blendCycleIndex >= BLEND_CYCLE_MODES.length) {
      blendCycleIndex = 0;
      cyclerA.advance();
      cyclerB.advance();
      if (cyclerC) cyclerC.advance();
    }
    setBlendMode(BLEND_CYCLE_MODES[blendCycleIndex]);
    scheduleAnalysis();
  }, BLEND_CYCLE_STEP_MS);
}

function startCurrentMode(){
  if (mode === "blendcycle") {
    startBlendCycleMode();
  } else {
    startNormalMode();
  }
}

blendSelect.addEventListener("change", function(){
  setBlendMode(blendSelect.value);
  scheduleAnalysis();
});

blendCycleToggle.addEventListener("change", function(){
  if (blendCycleToggle.checked) {
    mode = "blendcycle";
    blendSelect.disabled = true;
  } else {
    mode = "normal";
    blendSelect.disabled = false;
    setBlendMode(blendSelect.value);
  }
  startCurrentMode();
});

compareToggle.addEventListener("change", function(){
  paused = compareToggle.checked;
  if (paused) {
    stopTimer();
    compareButtons.style.display = "inline-flex";
    stageInner.style.filter = "none";
  } else {
    compareButtons.style.display = "none";
    startCurrentMode();
    scheduleAnalysisNow();

preBtn.addEventListener("click", function(){
  stageInner.style.filter = "none";
});
postBtn.addEventListener("click", function(){
  scheduleAnalysisNow();
});

layerAToggle.addEventListener("change", function(){
  updateLayerStack();
  scheduleAnalysis();
});
layerBToggle.addEventListener("change", function(){
  updateLayerStack();
  scheduleAnalysis();
});
layerCToggle.addEventListener("change", function(){
  updateLayerStack();
  scheduleAnalysis();
});

skipBackA.addEventListener("click", function(){ if (cyclerA) { cyclerA.back(); scheduleAnalysis(); } });
skipFwdA.addEventListener("click", function(){ if (cyclerA) { cyclerA.advance(); scheduleAnalysis(); } });
skipBackB.addEventListener("click", function(){ if (cyclerB) { cyclerB.back(); scheduleAnalysis(); } });
skipFwdB.addEventListener("click", function(){ if (cyclerB) { cyclerB.advance(); scheduleAnalysis(); } });
skipBackC.addEventListener("click", function(){ if (cyclerC) { cyclerC.back(); scheduleAnalysis(); } });
skipFwdC.addEventListener("click", function(){ if (cyclerC) { cyclerC.advance(); scheduleAnalysis(); } });

function disableLayerC(){
  layerCToggle.checked = false;
  layerCToggle.disabled = true;
  layerCLabel.classList.add("disabledLabel");
  skipBackC.disabled = true;
  skipFwdC.disabled = true;
  updateLayerStack();
}

function resolveInitialConfig(key, defaultCfg){
  const saved = savedAlbumUrl(key);
  if (saved) {
    const parsed = parseFlickrAlbumUrl(saved);
    if (parsed) {
      return { type: "flickr", apiKey: FLICKR_API_KEY, userId: parsed.userId, photosetId: parsed.photosetId };
    }
  }
  return defaultCfg;
}

Promise.all([
  loadLayerSource(resolveInitialConfig("A", LAYER_SOURCES.A)),
  loadLayerSource(resolveInitialConfig("B", LAYER_SOURCES.B))
]).then(function(results){
  const listA = results[0];
  const listB = results[1];
  if (listA.length === 0 || listB.length === 0) {
    stage.innerHTML = '<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; text-align:center; color:#9a9a9a; font-size:13px;">Layer A or Layer B returned no photos. Check the manifest file or Flickr album/API key configuration.</div>';
    return;
  }
  cyclerA = makeCycler("imgA", listA);
  cyclerB = makeCycler("imgB", listB);
  getCurrentA = cyclerA.getCurrent;
  getCurrentB = cyclerB.getCurrent;
  startCurrentMode();
  scheduleAnalysis();
}).catch(function(err){
  stage.innerHTML = '<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; text-align:center; color:#9a9a9a; font-size:13px;">Could not load Layer A or Layer B: ' + err.message + '. If using local folders, this page needs to run over http/https, not file://.</div>';
});

loadLayerSource(resolveInitialConfig("C", LAYER_SOURCES.C)).then(function(listC){
  if (listC.length === 0) {
    disableLayerC();
    return;
  }
  cyclerC = makeCycler("imgC", listC);
  getCurrentC = cyclerC.getCurrent;
  updateLayerStack();
}).catch(function(){
  disableLayerC();
});

const STORAGE_KEY = "blendCaptures";
let captures = [];
try {
  captures = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
} catch (e) {
  captures = [];
}

const analysisCanvas = document.createElement("canvas");
analysisCanvas.width = 40;
analysisCanvas.height = 40;
const actx = analysisCanvas.getContext("2d", { willReadFrequently: true });

let analysisTimer = null;
function scheduleAnalysis(){
  if (!autoBalance.checked) return;
  clearTimeout(analysisTimer);
  analysisTimer = setTimeout(analyzeAndCorrect, 150);
}
function scheduleAnalysisNow(){
  clearTimeout(analysisTimer);
  analyzeAndCorrect();
}

function activeLayerSources(){
  const arr = [];
  if (layerAToggle.checked) arr.push(getCurrentA());
  if (layerBToggle.checked) arr.push(getCurrentB());
  if (layerCToggle.checked && cyclerC) arr.push(getCurrentC());
  return arr.filter(function(s){ return !!s; });
}

function analyzeAndCorrect(){
  const sources = activeLayerSources();
  if (sources.length === 0) return;

  const imgs = sources.map(function(){ return new Image(); });
  let loaded = 0;

  function onAllLoaded(){
    actx.clearRect(0, 0, 40, 40);
    imgs.forEach(function(im, i){
      actx.globalCompositeOperation = i === 0 ? "source-over" : canvasBlendName(currentBlendValue);
      actx.drawImage(im, 0, 0, 40, 40);
    });
    actx.globalCompositeOperation = "source-over";

    let data;
    try {
      data = actx.getImageData(0, 0, 40, 40).data;
    } catch (e) {
      return;
    }

    let sum = 0;
    let sumSq = 0;
    let n = 0;
    for (let i = 0; i < data.length; i += 4) {
      const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      sum += lum;
      sumSq += lum * lum;
      n++;
    }
    const mean = sum / n;
    const variance = Math.max(sumSq / n - mean * mean, 0);
    const std = Math.sqrt(variance);

    applyCorrection(mean, std);
  }

  imgs.forEach(function(im, i){
    im.onload = function(){ loaded++; if (loaded === imgs.length) onAllLoaded(); };
    im.src = sources[i];
  });
}

function applyCorrection(mean, std){
  const lowBand = 95;
  const highBand = 160;

  let brightness = 1;
  if (mean < lowBand) {
    brightness = Math.min(2.2, lowBand / Math.max(mean, 8));
  } else if (mean > highBand) {
    brightness = Math.max(0.45, highBand / Math.min(mean, 247));
  }

  let contrast = 1;
  if (std < 28) {
    contrast = 1 + ((28 - std) / 28) * 0.6;
  }

  stageInner.style.filter = "brightness(" + brightness.toFixed(2) + ") contrast(" + contrast.toFixed(2) + ")";
}

function renderLog(){
  captureCountEl.textContent = captures.length + " captured";
  logEl.innerHTML = "";
  captures.slice().reverse().forEach(function(c){
    const realIndex = captures.indexOf(c);
    const cell = document.createElement("div");
    cell.className = "sheetCell";
    cell.innerHTML =
      '<img src="' + (c.thumb || "") + '" alt="">' +
      '<div class="sheetCap">' + c.sources.map(baseName).join(" + ") + " (" + c.blend + ")</div>" +
      '<button class="sheetDiscard" title="Discard">&times;</button>';
    cell.querySelector(".sheetDiscard").addEventListener("click", function(){
      captures.splice(realIndex, 1);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(captures));
      renderLog();
    });
    logEl.appendChild(cell);
  });
}
renderLog();

function renderThumbnail(entry){
  const THUMB_SIZE = 240;
  const imgs = entry.sources.map(function(){ return new Image(); });
  let loaded = 0;
  return new Promise(function(resolve){
    function onAllLoaded(){
      const canvas = document.createElement("canvas");
      canvas.width = THUMB_SIZE;
      canvas.height = THUMB_SIZE;
      const ctx = canvas.getContext("2d");
      imgs.forEach(function(im, i){
        ctx.globalCompositeOperation = i === 0 ? "source-over" : canvasBlendName(entry.blend);
        drawCover(ctx, im, THUMB_SIZE, THUMB_SIZE);
      });
      ctx.globalCompositeOperation = "source-over";
      if (entry.filter && entry.filter !== "none") {
        const filtered = document.createElement("canvas");
        filtered.width = THUMB_SIZE;
        filtered.height = THUMB_SIZE;
        const fctx = filtered.getContext("2d");
        fctx.filter = entry.filter;
        fctx.drawImage(canvas, 0, 0);
        resolve(filtered.toDataURL("image/jpeg", 0.8));
      } else {
        resolve(canvas.toDataURL("image/jpeg", 0.8));
      }
    }
    imgs.forEach(function(im, i){
      im.onload = function(){ loaded++; if (loaded === imgs.length) onAllLoaded(); };
      im.onerror = function(){ loaded++; if (loaded === imgs.length) onAllLoaded(); };
      im.src = entry.sources[i];
    });
  });
}

function capture(){
  const entry = {
    sources: activeLayerSources(),
    blend: currentBlendValue,
    cropped: cropToggle.checked,
    fullRes: fullResToggle.checked,
    filter: stageInner.style.filter || "none",
    thumb: "",
    time: new Date().toISOString()
  };
  if (entry.sources.length === 0) return;
  captures.push(entry);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(captures));
  renderLog();

  flash.classList.add("on");
  setTimeout(function(){ flash.classList.remove("on"); }, 80);

  renderThumbnail(entry).then(function(dataUrl){
    entry.thumb = dataUrl;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(captures));
    renderLog();
  });
}

function downloadContactSheet(){
  if (captures.length === 0) {
    alert("No captures yet -- press I to capture a pairing first.");
    return;
  }
  const cells = captures.map(function(c){
    return '<div class="cell"><img src="' + c.thumb + '" alt="">' +
      '<div class="cap">' + c.sources.map(baseName).join(" + ") + " (" + c.blend + ")<br>" + c.time + "</div></div>";
  }).join("");
  const html = "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Contact Sheet</title><style>" +
    "body{background:#111;color:#fff;font-family:Arial,Helvetica,sans-serif;margin:0;padding:30px;}" +
    "h1{font-size:20px;margin:0 0 20px;}" +
    ".grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));gap:14px;}" +
    ".cell{background:#1b1b1b;border:1px solid #2a2a2a;border-radius:8px;overflow:hidden;}" +
    ".cell img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}" +
    ".cap{font-size:11px;color:#9a9a9a;padding:8px 10px;}" +
    "</style></head><body>" +
    "<h1>Contact Sheet -- " + captures.length + " blend" + (captures.length === 1 ? "" : "s") + "</h1>" +
    "<div class='grid'>" + cells + "</div>" +
    "</body></html>";
  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "contact-sheet-" + Date.now() + ".html";
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById("downloadSheetBtn").addEventListener("click", downloadContactSheet);

function drawCover(ctx, img, w, h){
  const iw = img.naturalWidth;
  const ih = img.naturalHeight;
  const canvasRatio = w / h;
  const imgRatio = iw / ih;
  let sx, sy, sw, sh;
  if (imgRatio > canvasRatio) {
    sh = ih;
    sw = ih * canvasRatio;
    sx = (iw - sw) / 2;
    sy = 0;
  } else {
    sw = iw;
    sh = iw / canvasRatio;
    sx = 0;
    sy = (ih - sh) / 2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
}

function drawCenteredNative(ctx, img, canvasW, canvasH){
  const x = (canvasW - img.naturalWidth) / 2;
  const y = (canvasH - img.naturalHeight) / 2;
  ctx.drawImage(img, x, y, img.naturalWidth, img.naturalHeight);
}

function drawContain(ctx, img, w, h){
  const iw = img.naturalWidth;
  const ih = img.naturalHeight;
  const scale = Math.min(w / iw, h / ih);
  const dw = iw * scale;
  const dh = ih * scale;
  const dx = (w - dw) / 2;
  const dy = (h - dh) / 2;
  ctx.drawImage(img, dx, dy, dw, dh);
}

function baseName(path){
  return path.split("/").pop().replace(/\.[^/.]+$/, "");
}

function downloadCaptureImage(entry){
  const FIXED_SIZE = 1600;
  const imgs = entry.sources.map(function(){ return new Image(); });
  let loaded = 0;

  function onAllLoaded(){
    let biggest = imgs[0];
    imgs.forEach(function(im){
      if (im.naturalWidth * im.naturalHeight > biggest.naturalWidth * biggest.naturalHeight) {
        biggest = im;
      }
    });

    let canvasW, canvasH;
    if (entry.cropped) {
      const maxNative = Math.max(biggest.naturalWidth, biggest.naturalHeight);
      const size = entry.fullRes ? maxNative : FIXED_SIZE;
      canvasW = size;
      canvasH = size;
    } else if (entry.fullRes) {
      canvasW = biggest.naturalWidth;
      canvasH = biggest.naturalHeight;
    } else {
      const scale = FIXED_SIZE / Math.max(biggest.naturalWidth, biggest.naturalHeight);
      canvasW = Math.round(biggest.naturalWidth * scale);
      canvasH = Math.round(biggest.naturalHeight * scale);
    }

    const canvas = document.createElement("canvas");
    canvas.width = canvasW;
    canvas.height = canvasH;
    const ctx = canvas.getContext("2d");
    imgs.forEach(function(im, i){
      ctx.globalCompositeOperation = i === 0 ? "source-over" : canvasBlendName(entry.blend);
      if (entry.cropped) {
        drawCover(ctx, im, canvasW, canvasH);
      } else if (entry.fullRes) {
        drawCenteredNative(ctx, im, canvasW, canvasH);
      } else {
        drawContain(ctx, im, canvasW, canvasH);
      }
    });
    ctx.globalCompositeOperation = "source-over";

    const activeFilter = entry.filter;
    let finalCanvas = canvas;
    if (activeFilter && activeFilter !== "none") {
      const filtered = document.createElement("canvas");
      filtered.width = canvasW;
      filtered.height = canvasH;
      const fctx = filtered.getContext("2d");
      fctx.filter = activeFilter;
      fctx.drawImage(canvas, 0, 0);
      finalCanvas = filtered;
    }

    finalCanvas.toBlob(function(blob){
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const stamp = entry.time.replace(/[:.]/g, "-");
      const names = entry.sources.map(baseName).join("_");
      link.href = url;
      link.download = "blend_" + names + "_" + entry.blend + "_" + stamp + ".png";
      link.click();
      URL.revokeObjectURL(url);
    }, "image/png");
  }

  imgs.forEach(function(im, i){
    im.onload = function(){ loaded++; if (loaded === imgs.length) onAllLoaded(); };
    im.src = entry.sources[i];
  });
}

document.addEventListener("keydown", function(e){
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key.toLowerCase() === "i") {
    e.preventDefault();
    capture();
  }
});

document.getElementById("downloadBtn").addEventListener("click", function(){
  const blob = new Blob([JSON.stringify(captures, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "blend-captures.json";
  a.click();
  URL.revokeObjectURL(url);

  captures.forEach(function(entry){
    downloadCaptureImage(entry);
  });
});

document.getElementById("clearBtn").addEventListener("click", function(){
  captures = [];
  localStorage.removeItem(STORAGE_KEY);
  renderLog();
});

document.getElementById("resetDefaultsBtn").addEventListener("click", function(){
  if (!confirm("This clears any Flickr album URLs you've saved for Layer A/B/C in this browser and reloads with the built-in defaults. Your captures/contact sheet are not affected. Continue?")) {
    return;
  }
  localStorage.removeItem(URL_STORAGE_PREFIX + "A");
  localStorage.removeItem(URL_STORAGE_PREFIX + "B");
  localStorage.removeItem(URL_STORAGE_PREFIX + "C");
  location.reload();
});
