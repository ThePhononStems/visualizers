<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo sphere</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:transparent; overflow:hidden; }
  #wrap{ position:fixed; inset:0; }
  canvas{ display:block; width:100%; height:100%; }
  #fallback{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; }
  #fallback video{ width:min(100vw,100vh); height:min(100vw,100vh); object-fit:cover; border-radius:50%; }
</style>
</head>
<body>

<div id="wrap"></div>
<div id="fallback"><video autoplay muted loop playsinline></video></div>

<video id="tex" src="spheres/photo.mp4" autoplay muted loop playsinline crossorigin="anonymous" style="display:none"></video>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const vid = document.getElementById("tex");
  const wrap = document.getElementById("wrap");

  /* ---- tweakables ---- */
  const SPIN_SPEED = 0.32;   // radians/sec (~20s per turn). 0 = no spin.
  /* -------------------- */

  function showFallback(){
    wrap.style.display = "none";
    const fb = document.getElementById("fallback");
    fb.style.display = "flex";
    fb.querySelector("video").src = "spheres/photo.mp4";
  }
  if (!window.WebGLRenderingContext) { showFallback(); return; }

  let renderer;
  try { renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true }); }
  catch (e) { showFallback(); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  wrap.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  const texture = new THREE.VideoTexture(vid);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.wrapS = THREE.RepeatWrapping;   // seamless horizontal wrap while spinning

  const uniforms = {
    uTex:      { value: texture },
    uRes:      { value: new THREE.Vector2(1,1) },
    uLightDir: { value: new THREE.Vector3(-0.55, 0.65, 0.85) },
    uAmbient:  { value: 0.60 },
    uStrength: { value: 0.55 },
    uTime:     { value: 0.0 }
  };

  const vertexShader = `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `;

  /* Orthographic view of a lit 3D sphere with the video wrapped around it,
     spinning on the Y axis (CC-Sphere-style Rotation Y). The light is fixed
     in screen space, so it reads as a ball turning under steady light. */
  const fragmentShader = `
    precision mediump float;
    varying vec2 vUv;
    uniform sampler2D uTex;
    uniform vec2 uRes;
    uniform vec3 uLightDir;
    uniform float uAmbient;
    uniform float uStrength;
    uniform float uTime;
    const float PI = 3.14159265;
    void main(){
      vec2 p = (vUv - 0.5) * 2.0;
      float a = uRes.x / uRes.y;
      if (a > 1.0) p.x *= a; else p.y /= a;   // keep the ball circular
      float r = length(p);
      if (r > 1.0) discard;
      float z = sqrt(max(0.0, 1.0 - r*r));
      vec3 P = vec3(p.x, p.y, z);
      float ct = cos(uTime), st = sin(uTime);
      vec3 Pr = vec3(P.x*ct + P.z*st, P.y, -P.x*st + P.z*ct);
      float lon = atan(Pr.x, Pr.z);
      float lat = asin(clamp(Pr.y, -1.0, 1.0));
      vec2 uv = vec2(lon / (2.0*PI) + 0.5, 0.5 - lat / PI);
      vec4 col = texture2D(uTex, uv);
      vec3 N = normalize(vec3(p.x, p.y, z));
      float diff = clamp(dot(N, normalize(uLightDir)), 0.0, 1.0);
      float shade = min(uAmbient + uStrength * diff, 1.15);
      col.rgb *= shade;
      float edge = smoothstep(1.0, 0.98, r);
      gl_FragColor = vec4(col.rgb, col.a * edge);
    }
  `;

  const material = new THREE.ShaderMaterial({
    uniforms, vertexShader, fragmentShader, transparent:true
  });
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), material));

  function resize(){
    const w = wrap.clientWidth, h = wrap.clientHeight;
    renderer.setSize(w, h, false);
    uniforms.uRes.value.set(w, h);
  }
  window.addEventListener("resize", resize);
  resize();

  let last = performance.now();
  function animate(now){
    requestAnimationFrame(animate);
    const dt = (now - last) / 1000; last = now;
    uniforms.uTime.value += dt * SPIN_SPEED;
    renderer.render(scene, camera);
  }
  vid.play().catch(function(){});
  requestAnimationFrame(animate);
})();
</script>

</body>
</html>
