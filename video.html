/* ============================================================

   - PLAYLISTS: order, label, and icon image for each playlist.
   - PLAYLIST_MEMBERS: which video ids (from the list above)
     belong to each playlist. A video can appear in more than
     one playlist; a video in none simply won't show.
   ============================================================ */
const PLAYLISTS = [
  { key: "palestina", label: "Palestina",  icon: "video playlist buttons/Palestina.jpg" },
  { key: "bernie",    label: "Bernie",     icon: "video playlist buttons/Bernie.jpg" },
  { key: "climate",   label: "Climate",    icon: "video playlist buttons/climatechange copy.png" },
  { key: "fluentsee", label: "Fluentsee",  icon: "video playlist buttons/fluentsee.jpg" },
  { key: "misc",      label: "Misc",       icon: "video playlist buttons/MISC button3.jpg" }
];
const PLAYLIST_MEMBERS = {
  palestina: ["palestina"],
  bernie:    ["bernie-listen-science", "bernie-sanders-maybe-just-maybe", "bernie-21st-century-bill-of-rights", "bernie-what-patriotism"],
  climate:   ["crematorium", "crematorium-abridged", "media-distorts-climate-science", "bombogenesis-boston-2018"],
  fluentsee: ["fluentsee-2-two-way-street", "fluentsee-3-conjugacion-aaa", "fluentsee-5-negativo", "fluentsee-exclamativa"],
  misc:      ["portada", "e3-excerpt"]
};

function playlistVideos(key){
  const ids = PLAYLIST_MEMBERS[key] || [];
  return ids
    .map(function(id){ return videos.find(function(v){ return v.id === id; }); })
    .filter(function(v){ return !!v; });
}
function playlistOf(id){
  for (let i = 0; i < PLAYLISTS.length; i++) {
    if ((PLAYLIST_MEMBERS[PLAYLISTS[i].key] || []).indexOf(id) !== -1) return PLAYLISTS[i].key;
  }
  return PLAYLISTS[0].key;
}

const MOBILE_BREAKPOINT = 700;

const iconRail = document.getElementById("iconRail");
const titleList = document.getElementById("titleList");

const playBadge = document.getElementById("playBadge");

const progressFill = document.getElementById("progressFill");

const params = new URLSearchParams(window.location.search);
const startId = params.get("id") || videos[0].id;

let activeId = null;
let openId = null;
let seeking = false;
let activePlaylist = PLAYLISTS[0].key;

function loadVideo(item, autoplay){
  video.pause();
  video.poster = item.poster || "";
  video.src = item.src;
  video.load();
  timeline.value = 0;
  paintTimeline();
  if (autoplay) {
    video.play();
  }
}

function selectTitle(item, opts){
  opts = opts || {};
  activeId = item.id;
  if (opts.toggle === false) {
    openId = null;
  } else {
    openId = (openId === item.id) ? null : item.id;
  }
  loadVideo(item, false);
  renderList();
  if (opts.scroll) {
    maybeScrollToPlayer();
  }
}

function maybeScrollToPlayer(){
  if (window.innerWidth <= MOBILE_BREAKPOINT) {
    playerCol.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

function matchesSearch(item, query){
  if (!query) return true;
  const haystack = (
    item.title + " " +
    (item.titleNote || "") + " " +
    item.description + " " +
    item.tags.join(" ")
  ).toLowerCase();
  return haystack.indexOf(query) !== -1;
}

function renderList(){
  titleList.innerHTML = "";
  const query = searchBox.value.trim().toLowerCase();
  const visible = playlistVideos(activePlaylist).filter(function(item){
    return matchesSearch(item, query);
  });

  if (visible.length === 0) {
    const empty = document.createElement("div");
    empty.className = "no-results";
    empty.textContent = "No videos match your search.";
    titleList.appendChild(empty);
    return;
  }

  visible.forEach(function(item){
    const wrap = document.createElement("div");
    wrap.className = "title-wrap";

    const btn = document.createElement("button");
    btn.className = "title-btn" + (activeId === item.id ? " active" : "");
    btn.innerHTML = item.title +
      (item.titleNote ? ' <span class="title-note">' + item.titleNote + '</span>' : '');
    btn.addEventListener("click", function(){
      selectTitle(item, { scroll: true });
    });
    wrap.appendChild(btn);

    if (openId === item.id) {
      const panel = document.createElement("div");
      panel.className = "info-panel";
      panel.innerHTML =
        '<p>' + item.description + '</p>' +
        '<div class="info-meta">' + item.runtime + '</div>' +
        '<div class="info-tags">' +
        item.tags.map(function(t){ return '<span class="tag">' + t + '</span>'; }).join("") +
        '</div>';
      wrap.appendChild(panel);
    }

    titleList.appendChild(wrap);
  });
}

function renderRail(){
  iconRail.innerHTML = "";
  PLAYLISTS.forEach(function(pl){
    const btn = document.createElement("button");
    btn.className = "pl-btn" + (activePlaylist === pl.key ? " active" : "");
    btn.title = pl.label;
    btn.innerHTML =
      '<img class="pl-thumb" src="' + pl.icon + '" alt="' + pl.label + '">' +
      '<span class="pl-label">' + pl.label + '</span>';
    btn.addEventListener("click", function(){
      selectPlaylist(pl.key, { play: false });
    });
    iconRail.appendChild(btn);
  });
}

function selectPlaylist(key, opts){
  opts = opts || {};
  activePlaylist = key;
  searchBox.value = "";
  renderRail();
  const list = playlistVideos(key);
  const first = list[0];
  if (first) {
    selectTitle(first, { toggle: false, scroll: !!opts.scroll });
  } else {
    renderList();
  }
}

searchBox.addEventListener("input", function(){
  renderList();
});

videoArea.addEventListener("click", function(){
  if (video.paused) {
    video.play();
  } else {
    video.pause();
  }
});

video.addEventListener("play", function(){
  playBadge.classList.add("hidden");
});
video.addEventListener("pause", function(){
  playBadge.classList.remove("hidden");
});
video.addEventListener("ended", function(){
  playBadge.classList.remove("hidden");
});

function paintTimeline(){
  const pct = (timeline.value / timeline.max) * 100;
  progressFill.style.width = pct + "%";
}

video.addEventListener("timeupdate", function(){
  if (!seeking && Number.isFinite(video.duration)) {
    timeline.value = (video.currentTime / video.duration) * 1000;
    paintTimeline();
  }
});
timeline.addEventListener("input", function(){
  seeking = true;
  if (Number.isFinite(video.duration)) {
    video.currentTime = (timeline.value / 1000) * video.duration;
  }
  paintTimeline();
});
timeline.addEventListener("change", function(){
  seeking = false;
});

paintTimeline();

const initial = videos.find(function(v){ return v.id === startId; }) || videos[0];
activePlaylist = playlistOf(initial.id);
renderRail();
selectTitle(initial, { scroll: false, toggle: false });
</script>
