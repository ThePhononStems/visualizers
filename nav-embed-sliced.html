<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWT Media — Section Nav</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:transparent; }

  .swt-nav{
    /* --s controls overall size; each item scales from it, keeping the
       four graphics at their original relative proportions. */
    --s:clamp(48px, 7.2vw, 122px);
    display:grid;
    grid-template-columns:repeat(4, 1fr);   /* four equal columns = even spacing */
    align-items:center;
    justify-items:center;
    gap:2%;
    width:100%;
    padding:12px 2%;
  }
  .item{
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:0;
    transition:transform .2s ease, filter .25s ease;
  }
  .item img{
    display:block;
    width:auto;
    /* baked-in gray; hover brightens the graphic toward white */
    transition:filter .25s ease;
  }
  .item:hover{ transform:translateY(-2px); }
  .item:hover img{
    filter:brightness(3) drop-shadow(0 0 12px rgba(255,255,255,0.28));
  }

  /* original pixel heights: 244 / 190 / 199 / 217  -> scaled off --s */
  .photo  img{ height:var(--s); }
  .video  img{ height:calc(var(--s) * 0.779); }
  .audio  img{ height:calc(var(--s) * 0.816); }
  .motion img{ height:calc(var(--s) * 0.889); }
</style>
</head>
<body>

<nav class="swt-nav" aria-label="SWT Media sections">
  <a class="item photo"  target="_top" href="https://www.swtmedia.com/home_2/photography-slideshow"><img src="nav-slices/item1.png" alt="Photo & Photoshop"></a>
  <a class="item video"  target="_top" href="https://www.swtmedia.com/home_2/video-player"><img src="nav-slices/item2.png" alt="Video & Edit"></a>
  <a class="item audio"  target="_top" href="https://www.swtmedia.com/home_2/music"><img src="nav-slices/item3.png" alt="Music & Audio"></a>
  <a class="item motion" target="_top" href="https://www.swtmedia.com/home_2/motiongfx"><img src="nav-slices/item4.png" alt="Motion GFX"></a>
</nav>

</body>
</html>
