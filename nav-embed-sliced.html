<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWT Media — Section Nav</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:transparent; }

  .swt-nav{
    --s:clamp(48px, 7.2vw, 122px);   /* overall size */
    --ink:#7a7a7a;                   /* resting gray */
    --hl:#56C6D8;                    /* hover highlight color */
    display:grid;
    grid-template-columns:repeat(4, 1fr);   /* even columns */
    align-items:center;
    justify-items:center;
    gap:2%;
    width:100%;
    padding:12px 2%;
  }
  .item{
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:0;
    transition:transform .2s ease;
  }
  .item:hover{ transform:translateY(-2px); }

  /* the shape is the slice used as a mask, so we can paint it any color */
  .shape{
    display:block;
    background:var(--ink);
    -webkit-mask:var(--img) center / contain no-repeat;
            mask:var(--img) center / contain no-repeat;
    transition:background .25s ease, filter .25s ease;
  }
  .item:hover .shape{
    background:var(--hl);
    filter:drop-shadow(0 0 12px rgba(86,198,216,0.35));
  }

  /* "you are here": the current page's button is lit by default ... */
  .item.active .shape{
    background:var(--hl);
    filter:drop-shadow(0 0 12px rgba(86,198,216,0.35));
  }
  /* ... but while the cursor is over the nav, the active button steps aside
     for whichever button is actually being hovered (and relights on leave). */
  .swt-nav:hover .item.active:not(:hover) .shape{
    background:var(--ink);
    filter:none;
  }

  /* per item: slice, native aspect ratio, and height (kept in original proportion) */
  .photo  .shape{ --img:url(nav-slices/item1.png); aspect-ratio:440/244; height:var(--s); }
  .video  .shape{ --img:url(nav-slices/item2.png); aspect-ratio:405/190; height:calc(var(--s) * 0.779); }
  .audio  .shape{ --img:url(nav-slices/item3.png); aspect-ratio:460/199; height:calc(var(--s) * 0.816); }
  .motion .shape{ --img:url(nav-slices/item4.png); aspect-ratio:351/217; height:calc(var(--s) * 0.889); }
</style>
</head>
<body>

<nav class="swt-nav" aria-label="SWT Media sections">
  <a class="item photo"  target="_blank" rel="noopener" href="https://www.swtmedia.com/home_2/photography-slideshow"><span class="shape" role="img" aria-label="Photo & Photoshop"></span></a>
  <a class="item video"  target="_blank" rel="noopener" href="https://www.swtmedia.com/home_2/video-player"><span class="shape" role="img" aria-label="Video & Edit"></span></a>
  <a class="item audio"  target="_blank" rel="noopener" href="https://www.swtmedia.com/home_2/music"><span class="shape" role="img" aria-label="Music & Audio"></span></a>
  <a class="item motion" target="_blank" rel="noopener" href="https://www.swtmedia.com/home_2/motiongfx"><span class="shape" role="img" aria-label="Motion GFX"></span></a>
</nav>

<script>
  /* Which button is "you are here" is set per page via the embed URL, e.g.
       nav-embed-sliced.html?active=video
     Valid values: photo | video | audio | motion */
  (function(){
    var a = (new URLSearchParams(location.search).get("active") || "").replace(/[^a-z]/gi, "");
    if (!a) return;
    var el = document.querySelector(".item." + a);
    if (el) el.classList.add("active");
  })();
</script>

</body>
</html>
