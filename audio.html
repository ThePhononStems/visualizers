<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IM+Fell+English&family=Raleway:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: #fff;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Full player card */
  #wrap {
    position: relative;
    width: 100%;
    background: #000;
    overflow: hidden;
  }

  #visualizer {
    display: block;
    width: 100%;
    height: 420px;
    background: #000;
    touch-action: manipulation;
  }

  /* Controls bar */
  #bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: #0a0a0a;
    border-top: 1px solid rgba(255,255,255,0.08);
    flex-wrap: wrap;
  }

  #playBtn {
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: #fff;
    color: #000;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .12s ease, background .2s ease;
  }
  #playBtn:hover { transform: scale(1.06); }
  #playBtn:active { transform: scale(0.96); }

  .meta {
    flex: 1 1 160px;
    min-width: 0;
  }
  #trackTitle {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #time {
    font-size: 11px;
    opacity: .55;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }

  /* Progress */
  #seek {
    flex: 1 1 100%;
    order: 5;
    -webkit-appearance: none;
    appearance: none;
    height: 5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.15);
    cursor: pointer;
    margin: 2px 0;
  }
  #seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }
  #seek::-moz-range-thumb {
    width: 14px; height: 14px; border: none;
    border-radius: 50%; background: #fff; cursor: pointer;
  }

  select, .chip {
    background: #1a1a1a;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    cursor: pointer;
    outline: none;
    max-width: 46vw;
  }
  select { text-overflow: ellipsis; }

  .toggles { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 7px 11px;
    transition: background .15s ease, border-color .15s ease;
  }
  .chip[data-active="1"] {
    background: #fff;
    color: #000;
    border-color: #fff;
  }

  /* Two-column layout: track list left, visualizer right */
  #layout {
    display: flex;
    align-items: stretch;
    gap: 8px;
    background: #000;
  }
  #wrap { flex: 1 1 auto; min-width: 0; }        /* visualizer takes the rest */

  /* Clickable track list on the left */
  #trackList {
    flex: 0 0 auto;
    width: 240px;
    max-width: 32vw;
    list-style: none;
    margin: 0;
    padding: 22px 16px;
    background: #000;
    font-family: "Special Elite", "Courier New", Courier, monospace;
    align-self: flex-start;
  }
  #trackList li {
    font-family: "Raleway", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 16.59px;              /* title size, reduced another 3% (parens held fixed below) */
    line-height: 1.5;
    text-transform: uppercase;
    font-variant-caps: normal;
    letter-spacing: 0.5px;
    color: #1fbfd4;                  /* teal-blue default */
    cursor: pointer;
    padding: 4px 0;
    transition: color .15s ease, transform .12s ease;
    width: fit-content;
  }
  #trackList li:hover { color: #ddb459; transform: translateX(4px); } /* warm, dusty gold */
  #trackList li[data-active="1"] { color: #ddb459; }
  #trackList li[data-active="1"]::before {
    content: "\25B6  ";              /* ▶ marker on the playing track */
    font-size: 0.7em;
  }

  /* Parenthetical text renders at ~60% of the surrounding text size */
  .paren { font-size: 0.6em; }
  /* In the track list, hold parentheses at their prior size so only the
     title text shrank by 10%, not the parenthetical text. */
  #trackList li .paren { font-size: 11.4px; }

  /* On narrow screens, stack the list above the visualizer */
  @media (max-width: 560px) {
    #layout { flex-direction: column; }
    #trackList { width: 100%; max-width: none; align-self: stretch; padding: 16px 20px; }
  }
</style>
</head>
<body>

<div id="layout">
<ul id="trackList" aria-label="Track list"></ul>

<div id="wrap">
  <canvas id="visualizer"></canvas>

  <div id="bar">
    <button id="playBtn" aria-label="Play">&#9654;</button>

    <div class="meta">
      <div id="trackTitle">—</div>
      <div id="time">0:00 / 0:00</div>
    </div>

    <div class="toggles" id="modeToggles">
      <button class="chip" data-mode="bars" data-active="1">Bars</button>
      <button class="chip" data-mode="radial">Radial</button>
      <button class="chip" data-mode="wave">Wave</button>
    </div>

    <select id="themeSel" aria-label="Color theme">
      <option value="warm">Warm</option>
      <option value="mono">Mono</option>
      <option value="spectrum">Spectrum</option>
      <option value="neon">Neon</option>
    </select>

    <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
  </div>
</div>
</div><!-- /layout -->

<!-- Media element: crossOrigin anonymous is safe for same-origin files and
     lets you later move audio to a CORS-enabled host without code changes. -->
<audio id="audio" preload="metadata" crossorigin="anonymous"></audio>

<script>
"use strict";

/* ============================================================
   TRACK LIST
   Add/remove songs here. `file` is relative to this HTML file
   (your MP3s live in the audios/ folder). Spaces are fine —
   they get URL-encoded automatically.
   You can also deep-link one track when embedding:
     audio.html?track=SWTAFX%20-%20VAST.mp3
   ============================================================ */
const TRACKS = [
  { title: "Homecoming",      file: "audios/SWTAFX - STOMPING GROUND.mp3" },
  { title: "Expanse",         file: "audios/SWTAFX - EXPANSE.mp3" },
  { title: "Worlds Apart",    file: "audios/SWTAFX - Worlds Apart.mp3" },
  { title: "Espero Al Final", file: "audios/SWTAFX - Espero Al Final.mp3" },
  { title: "Color Burn",      file: "audios/SWTAFX - Color Burn.mp3" },
  { title: "Fading",          file: "audios/SWTAFX - Fading.mp3" },
  { title: "Fanfare",         file: "audios/SWTAFX - Fanfare.mp3" },
  { title: "Crack of Dawn",   file: "audios/SWTAFX - CRACKOFDAWN.mp3" },
  { title: "Brown",           file: "audios/SWTAFX - BROWN.mp3" },
  { title: "Melancholy (Quiet Plea instrumental)", file: "audios/SWTAFX - Melancholy (Quiet Plea Instrumental).mp3" },
  { title: "Quiet Plea",           file: "audios/SWTAFX - Quiet Plea.mp3" },

];

/* ============================================================
   ELEMENTS
   ============================================================ */
const audio      = document.getElementById("audio");
const canvas     = document.getElementById("visualizer");
const g          = canvas.getContext("2d");
const playBtn    = document.getElementById("playBtn");
const trackTitle = document.getElementById("trackTitle");
const timeEl     = document.getElementById("time");
const seek       = document.getElementById("seek");
const trackList  = document.getElementById("trackList");
const themeSel   = document.getElementById("themeSel");
const modeToggles= document.getElementById("modeToggles");

/* ============================================================
   CONFIG (read from ?params when embedding)
   ============================================================ */
const params = new URLSearchParams(location.search);
let MODE  = params.get("mode")  || "bars";     // bars | radial | wave
let THEME = params.get("theme") || "warm";      // warm | mono | spectrum | neon
const startTrackParam = params.get("track");

/* ============================================================
   WEB AUDIO GRAPH
   ============================================================ */
let audioCtx = null, analyser = null, waveA = null, source = null;
let freq = null, time = null;
let running = false, rafId = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  source = audioCtx.createMediaElementSource(audio);

  // FAST analyser for the frequency bars/bands: a small FFT means a short
  // analysis window, so snare/cymbal transients register immediately.
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;                  // ~46ms window — snappy, low latency
  analyser.smoothingTimeConstant = 0.5;     // light per-bin smoothing

  // WIDE analyser used only for the oscilloscope waveform display, where a
  // long time window is what we actually want (~0.74s across the screen).
  waveA = audioCtx.createAnalyser();
  waveA.fftSize = 32768;                     // max the AnalyserNode allows
  waveA.smoothingTimeConstant = 0;

  source.connect(analyser);
  source.connect(waveA);
  analyser.connect(audioCtx.destination);    // playback path (one connection is enough)

  freq = new Uint8Array(analyser.frequencyBinCount);
  time = new Uint8Array(waveA.fftSize);
}

/* ============================================================
   FREQUENCY BANDS — the heart of the drum reactivity.
   Each band gets its own fast-attack / slow-release envelope
   plus an onset (spectral-flux) detector that fires on hits.
   ============================================================ */
const BANDS = [
  { name: "sub",    lo: 20,    hi: 90 },    // kick fundamental
  { name: "kick",   lo: 90,    hi: 180 },   // kick body
  { name: "bass",   lo: 180,   hi: 400 },
  { name: "lowmid", lo: 400,   hi: 1200 },
  { name: "snare",  lo: 1200,  hi: 3000 },  // snare crack / body
  { name: "presence",lo: 3000, hi: 6000 },
  { name: "hats",   lo: 6000,  hi: 10000 },
  { name: "cymbal", lo: 10000, hi: 16000 }  // cymbal shimmer
];

const env  = new Float32Array(BANDS.length); // smoothed level per band
const prev = new Float32Array(BANDS.length); // previous raw energy (for flux)
const onset= new Float32Array(BANDS.length); // transient flash per band (decays)

const ATTACK  = 0.85;  // how fast levels rise
const RELEASE = 0.14;  // how fast they fall (slower => visible sustain)
const ONSET_DECAY = 0.86;

function bandEnergy(loHz, hiHz) {
  const nyq = audioCtx.sampleRate / 2;
  const binHz = nyq / freq.length;
  let lo = Math.max(0, Math.floor(loHz / binHz));
  let hi = Math.min(freq.length - 1, Math.ceil(hiHz / binHz));
  let sum = 0, n = 0;
  for (let i = lo; i <= hi; i++) { sum += freq[i] / 255; n++; }
  return n ? sum / n : 0;
}

function analyze() {
  analyser.getByteFrequencyData(freq);       // fast FFT → responsive bars/bands
  waveA.getByteTimeDomainData(time);         // wide FFT → long waveform window
  for (let b = 0; b < BANDS.length; b++) {
    const raw = bandEnergy(BANDS[b].lo, BANDS[b].hi);
    // envelope
    const r = raw > env[b] ? ATTACK : RELEASE;
    env[b] += (raw - env[b]) * r;
    // spectral flux (only positive rises => an attack/onset)
    const flux = Math.max(0, raw - prev[b]);
    prev[b] = prev[b] * 0.6 + raw * 0.4;
    const hit = Math.min(1, flux * 4.0);
    onset[b] = Math.max(onset[b] * ONSET_DECAY, hit);
  }
}

// convenience aggregates
function lowLevel()  { return Math.max(env[0], env[1]); }              // kick
function snareHit()  { return Math.max(onset[4], onset[5]); }          // snare transient
function cymbalHit() { return Math.max(onset[6], onset[7]); }          // cymbal transient
function overall()   { let s = 0; for (let i=0;i<env.length;i++) s+=env[i]; return s/env.length; }

/* ============================================================
   COLOR THEMES
   pos: 0..1 across the spectrum. intensity: 0..1.
   ============================================================ */
function color(pos, intensity, alpha) {
  pos = Math.min(1, Math.max(0, pos));
  intensity = Math.min(1, Math.max(0, intensity));
  let r, gg, b;
  if (THEME === "mono") {
    const v = 180 + 75 * intensity;
    r = gg = b = v;
  } else if (THEME === "warm") {
    // deep red -> orange -> yellow -> white hot
    r = 255;
    gg = 40 + 200 * pos * (0.4 + 0.6 * intensity);
    b = 20 + 120 * pos * pos * intensity;
  } else if (THEME === "spectrum") {
    const h = 260 - pos * 260;               // blue->red rainbow
    return hsl(h, 90, 45 + 25 * intensity, alpha);
  } else { // neon: cyan -> violet -> magenta, glowing
    if (pos < 0.5) { const t = pos/0.5; r = 0+150*t; gg = 230-120*t; b = 255; }
    else           { const t = (pos-0.5)/0.5; r = 150+105*t; gg = 110-90*t; b = 255-40*t; }
    const boost = 0.55 + 0.45 * intensity;
    r*=boost; gg*=boost; b*=boost;
  }
  return "rgba(" + (r|0) + "," + (gg|0) + "," + (b|0) + "," + alpha + ")";
}
function hsl(h,s,l,a){ return "hsla(" + h + "," + s + "%," + l + "%," + a + ")"; }

/* ============================================================
   CANVAS SIZING (DPR-aware)
   ============================================================ */
let W = 0, H = 0, DPR = 1;
function resize() {
  // Cap the pixel ratio. Beyond ~1.75x the extra sharpness is invisible
  // but the per-frame fill/glow cost grows with DPR squared — the main
  // cause of the animation throttling down after it heats the CPU/GPU.
  DPR = Math.min(window.devicePixelRatio || 1, 1.75);
  W = canvas.width  = Math.round(canvas.clientWidth  * DPR);
  H = canvas.height = Math.round(canvas.clientHeight * DPR);
}
window.addEventListener("resize", resize);

/* ============================================================
   PARTICLE SYSTEM (for wave mode — snare/cymbal bursts)
   ============================================================ */
const particles = [];
function spawnBurst(x, y, n, hue, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.4 + Math.random() * 0.9);
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
                     life: 1, hue, size: (1.5 + Math.random()*2.5) * DPR });
  }
  if (particles.length > 600) particles.splice(0, particles.length - 600);
}

/* ============================================================
   RENDERERS
   ============================================================ */
const NB = 64; // number of display bars (spectrum modes)

function sampleSpectrum(i, count) {
  // log-spaced sampling across the audible range for musical bars
  const nyq = audioCtx.sampleRate / 2;
  const minF = 30, maxF = 16000;
  const f0 = minF * Math.pow(maxF / minF, i / count);
  const f1 = minF * Math.pow(maxF / minF, (i + 1) / count);
  const binHz = nyq / freq.length;
  let lo = Math.max(0, Math.floor(f0 / binHz));
  let hi = Math.min(freq.length - 1, Math.max(lo, Math.floor(f1 / binHz)));
  let peak = 0;
  for (let k = lo; k <= hi; k++) if (freq[k] > peak) peak = freq[k];
  let v = peak / 255;
  // tilt: lift the highs so cymbals/hats read as strongly as bass
  v *= 0.75 + 0.9 * (i / count);
  // Higher contrast: an expansion curve (gamma > 1) pushes quiet
  // passages down and loud transients up, then a gain restores height.
  // Gain kept modest so bars rarely hit the ceiling and get clipped.
  v = Math.pow(Math.min(1, v), 1.7) * 1.4;
  return Math.min(1, v);
}

// smoothed bar heights for a fluid look
const barVals = new Float32Array(NB);

function drawBars() {
  const pad = 16 * DPR;
  const usable = W - pad * 2;
  const gap = 2 * DPR;
  const bw = (usable - gap * (NB - 1)) / NB;
  const baseY = H * 0.94;
  const maxH = H * 0.90;
  const kick = lowLevel();

  for (let i = 0; i < NB; i++) {
    let v = sampleSpectrum(i, NB);
    // envelope smoothing per bar — near-instant attack for snappy hits,
    // slightly faster release so bars fall back quickly between transients.
    const r = v > barVals[i] ? 0.92 : 0.24;
    barVals[i] += (v - barVals[i]) * r;
    v = barVals[i];

    const x = pad + i * (bw + gap);
    const h = Math.max(2 * DPR, v * maxH);
    const pos = i / (NB - 1);
    const rad = Math.min(bw/2, 4*DPR);

    // Cheap additive glow: a wider, faint bar drawn behind the solid one
    // using the "lighter" blend. Visually close to shadowBlur but far
    // cheaper, so it won't throttle the frame rate over time.
    if (THEME !== "mono") {
      g.globalCompositeOperation = "lighter";
      g.fillStyle = color(pos, v, 0.18 + 0.35 * v);
      const gw = bw + 6 * DPR;
      roundRect(x - 3 * DPR, baseY - h, gw, h, rad);
      g.fill();
      g.globalCompositeOperation = "source-over";
    }

    // solid core bar
    g.fillStyle = color(pos, v, 0.95);
    roundRect(x, baseY - h, bw, h, rad);
    g.fill();

    // mirror reflection
    g.fillStyle = color(pos, v, 0.10);
    roundRect(x, baseY, bw, h * 0.4, rad);
    g.fill();
  }

  // kick pulse — a floor line that flashes on the beat
  g.fillStyle = color(0.1, kick, 0.12 + 0.5 * kick);
  g.fillRect(0, baseY, W, 2 * DPR);
}

let radialRot = 0;
function drawRadial() {
  const cx = W / 2, cy = H / 2;
  const kick = lowLevel();
  const cym = cymbalHit();
  // Size everything off the available radius so nothing clips top/bottom.
  const avail = Math.min(W, H) * 0.5 * 0.9;                // 90% of half-canvas
  const base = avail * 0.32 * (1 + kick * 0.4);            // core pulses with kick
  const maxLen = avail * 0.5;                              // spoke length
  const N = 96;

  radialRot += 0.0015 + kick * 0.01;

  // core glow
  const coreR = base * (0.55 + 0.25 * kick);
  const grad = g.createRadialGradient(cx, cy, 0, cx, cy, coreR * 2.4);
  grad.addColorStop(0, color(0.15, 0.6 + kick, 0.55 + 0.4*kick));
  grad.addColorStop(1, color(0.15, 0.2, 0));
  g.fillStyle = grad;
  g.beginPath(); g.arc(cx, cy, coreR * 2.4, 0, Math.PI*2); g.fill();

  g.lineCap = "round";
  for (let i = 0; i < N; i++) {
    const v = sampleSpectrum(i % NB === 0 ? 0 : Math.floor(i / N * NB), NB);
    const ang = (i / N) * Math.PI * 2 + radialRot;
    const len = base * 0.2 + v * maxLen;
    const x1 = cx + Math.cos(ang) * base;
    const y1 = cy + Math.sin(ang) * base;
    const x2 = cx + Math.cos(ang) * (base + len);
    const y2 = cy + Math.sin(ang) * (base + len);
    const pos = i / N;
    // Additive blend gives the spokes a glow without per-spoke shadowBlur,
    // which would throttle the frame rate the same way the bars did.
    g.globalCompositeOperation = (THEME === "mono") ? "source-over" : "lighter";
    g.strokeStyle = color(pos, v, 0.85);
    g.lineWidth = (2 + v * 3) * DPR;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  }
  g.globalCompositeOperation = "source-over";

  // cymbal ring flash — expanding bright ring on cymbal transients
  if (cym > 0.05) {
    g.strokeStyle = color(0.95, 1, cym * 0.8);
    g.lineWidth = 2 * DPR * cym;
    const ringR = Math.min(avail, base + maxLen * (0.6 + cym * 0.4));
    g.beginPath();
    g.arc(cx, cy, ringR, 0, Math.PI*2);
    g.stroke();
  }
}

function drawWave() {
  const mid = H / 2;
  const kick = lowLevel();

  // Zoomed-out, calmer oscilloscope waveform.
  // A smaller vertical scale and gentle kick influence keep it from
  // looking manic; a wider time slice makes the wave read as smoother.
  g.lineWidth = (2 + kick * 1.5) * DPR;
  g.strokeStyle = color(0.4, 0.6 + overall(), 0.95);
  g.shadowBlur = (THEME === "mono" ? 6 : 14) * DPR;
  g.shadowColor = color(0.4, 0.9, 0.7);
  g.beginPath();
  const step = Math.max(1, Math.floor(time.length / W));
  const amp = H * 0.26 * (0.85 + kick * 0.25);   // zoomed out (was 0.42, 0.6+kick)
  for (let i = 0, x = 0; i < time.length; i += step, x += (W / (time.length / step))) {
    const y = mid + ((time[i] - 128) / 128) * amp;
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.stroke();
  g.shadowBlur = 0;
}

function roundRect(x, y, w, h, r) {
  if (h < 0) { y += h; h = -h; }
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r, y);
  g.arcTo(x+w, y, x+w, y+h, r);
  g.arcTo(x+w, y+h, x, y+h, r);
  g.arcTo(x, y+h, x, y, r);
  g.arcTo(x, y, x+w, y, r);
  g.closePath();
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
function frame() {
  if (!running) return;
  rafId = requestAnimationFrame(frame);
  analyze();

  // fade previous frame slightly for motion trails (except bars which clear)
  if (MODE === "bars") {
    g.fillStyle = "#000";
    g.fillRect(0, 0, W, H);
  } else {
    g.fillStyle = "rgba(0,0,0,0.22)";
    g.fillRect(0, 0, W, H);
  }

  if (MODE === "radial") drawRadial();
  else if (MODE === "wave") drawWave();
  else drawBars();
}

function start() {
  initAudio();
  if (audioCtx.state === "suspended") audioCtx.resume();
  if (!running) { running = true; resize(); frame(); }
}
function stop() {
  running = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
}

/* ============================================================
   TRANSPORT / UI WIRING
   ============================================================ */
/* Escape, then shrink any (parenthetical) portion to ~60% size */
function escHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function formatTitle(s){
  return escHtml(s).replace(/(\([^)]*\))/g, '<span class="paren">$1</span>');
}

function loadTrack(idx) {
  idx = (idx + TRACKS.length) % TRACKS.length;
  const t = TRACKS[idx];
  audio.src = encodeURI(t.file);
  trackTitle.innerHTML = formatTitle(t.title);
  timeEl.textContent = "0:00 / 0:00";
  // highlight the active item in the list
  trackList.querySelectorAll("li").forEach((li, i) =>
    li.dataset.active = (i === idx) ? "1" : "0");
}

function fmt(s) {
  if (!isFinite(s)) return "0:00";
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return m + ":" + (ss < 10 ? "0" : "") + ss;
}

// build clickable track list
TRACKS.forEach((t, i) => {
  const li = document.createElement("li");
  li.innerHTML = formatTitle(t.title);
  li.addEventListener("click", () => {
    startIdx = i;
    loadTrack(i);
    audio.play();            // clicking a title cues + plays it
  });
  trackList.appendChild(li);
});

// initial track (respect ?track= param)
let startIdx = 0;
if (startTrackParam) {
  const norm = decodeURIComponent(startTrackParam).toLowerCase();
  const found = TRACKS.findIndex(t =>
    t.file.toLowerCase().includes(norm) || t.title.toLowerCase().includes(norm));
  if (found >= 0) startIdx = found;
}
loadTrack(startIdx);

// initial theme/mode from params
themeSel.value = THEME;
modeToggles.querySelectorAll(".chip").forEach(c =>
  c.dataset.active = (c.dataset.mode === MODE) ? "1" : "0");

playBtn.addEventListener("click", () => {
  if (audio.paused) audio.play(); else audio.pause();
});

audio.addEventListener("play", () => { playBtn.innerHTML = "&#10073;&#10073;"; start(); });
audio.addEventListener("pause", () => { playBtn.innerHTML = "&#9654;"; stop(); });
audio.addEventListener("ended", () => { loadTrack(startIdx = (startIdx + 1)); audio.play(); });

audio.addEventListener("timeupdate", () => {
  if (audio.duration) {
    seek.value = String((audio.currentTime / audio.duration) * 1000);
    timeEl.textContent = fmt(audio.currentTime) + " / " + fmt(audio.duration);
  }
});
audio.addEventListener("loadedmetadata", () => {
  timeEl.textContent = fmt(0) + " / " + fmt(audio.duration);
});

seek.addEventListener("input", () => {
  if (audio.duration) audio.currentTime = (seek.value / 1000) * audio.duration;
});


themeSel.addEventListener("change", () => { THEME = themeSel.value; });

modeToggles.addEventListener("click", e => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  MODE = btn.dataset.mode;
  modeToggles.querySelectorAll(".chip").forEach(c =>
    c.dataset.active = (c === btn) ? "1" : "0");
  // clear canvas on mode switch
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
});

// size once ready
resize();
// draw a faint idle baseline so the canvas isn't blank before playback
g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
</script>
</body>
</html>
