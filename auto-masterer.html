<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Masterer</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--panel2:#1c2330;--acc:#4cc2ff;--acc2:#7af0c0;--warn:#ffb454;--txt:#e6edf3;--mut:#8b96a5;--line:#2a323d;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
  header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
  header h1{font-size:19px;margin:0;font-weight:650}
  header .tag{color:var(--mut);font-size:13px}
  main{max-width:960px;margin:0 auto;padding:24px}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:44px;text-align:center;transition:.15s;cursor:pointer;background:var(--panel)}
  .drop.hover{border-color:var(--acc);background:var(--panel2)}
  .drop h2{margin:.2em 0;font-size:17px}
  .drop p{color:var(--mut);margin:.2em 0;font-size:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px}
  .row{display:flex;gap:20px;flex-wrap:wrap}
  .row>div{flex:1;min-width:240px}
  h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 12px}
  canvas{width:100%;height:170px;display:block;background:var(--panel2);border-radius:10px}
  .meters{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
  .meter{background:var(--panel2);border-radius:10px;padding:12px 16px;flex:1;min-width:120px}
  .meter .v{font-size:22px;font-weight:650}
  .meter .l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
  .meter .d{font-size:12px;color:var(--acc2)}
  button{background:var(--acc);color:#00121f;border:0;border-radius:9px;padding:12px 20px;font-size:15px;font-weight:650;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}
  button.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:16px}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
  select,input[type=range]{accent-color:var(--acc)}
  select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px}
  .findings{margin-top:14px;font-size:14px}
  .finding{padding:8px 12px;background:var(--panel2);border-radius:8px;margin-bottom:8px;border-left:3px solid var(--acc)}
  .finding.corr{border-left-color:var(--acc2)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-bottom:8px}
  .legend .k{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  audio{width:100%;margin-top:10px}
  .hide{display:none}
  .bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:14px}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:.2s}
  .note{color:var(--mut);font-size:12px;margin-top:10px}
  .sliders{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 22px;margin-top:6px}
  .sl{display:flex;flex-direction:column;gap:3px}
  .sl label{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
  .sl b{color:var(--acc2);font-weight:600}
  .sl input[type=range]{width:100%;accent-color:var(--acc)}
  .grp{grid-column:1/-1;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--acc);margin:12px 0 -2px;font-weight:650}
  .exp{color:var(--warn);font-size:11px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"></script>
</head>
<body>
<header>
  <h1>🎚 Auto Masterer</h1>
  <span class="tag">analyze · correct · master — all in your browser</span>
</header>
<main>
  <div class="drop" id="drop">
    <h2>Drop an audio file here</h2>
    <p>WAV, MP3, FLAC, OGG, M4A — decoded &amp; processed locally, nothing uploaded</p>
    <p style="margin-top:14px"><button class="sec" id="pick">Choose file</button></p>
    <input type="file" id="file" accept="audio/*" class="hide">
  </div>

  <div class="panel hide" id="work">
    <h3>1 · Analysis</h3>
    <div class="legend">
      <span><span class="k" style="background:#4cc2ff"></span>Your track</span>
      <span><span class="k" style="background:#7af0c0"></span>Target balance</span>
      <span><span class="k" style="background:#ffb454"></span>Mastered</span>
    </div>
    <canvas id="spec"></canvas>
    <div class="meters" id="meters"></div>
    <div class="findings" id="findings"></div>

    <div class="panel" style="margin-top:20px;background:var(--panel2)">
      <h3>2 · Master console</h3>
      <div class="sliders" id="sliders"></div>
      <div class="controls">
        <button id="master">⚡ Render master</button>
        <button class="sec" id="auto">✨ Auto-set from analysis</button>
        <button class="sec" id="resetSliders">Reset to defaults</button>
        <button class="sec" id="reset">Load another track</button>
      </div>
      <div class="bar hide" id="progwrap"><i id="prog"></i></div>
      <div class="note" id="status"></div>
    </div>

    <div class="panel hide" id="result" style="margin-top:20px">
      <h3>3 · Result</h3>
      <div class="row">
        <div>
          <p style="font-size:13px;color:var(--mut);margin:0 0 6px">Original</p>
          <audio id="aOrig" controls></audio>
        </div>
        <div>
          <p style="font-size:13px;color:var(--mut);margin:0 0 6px">Mastered</p>
          <audio id="aMast" controls></audio>
        </div>
      </div>
      <div class="controls">
        <label class="f">Format
          <select id="fmt">
            <option value="wav">WAV · 16-bit</option>
            <option value="mp3">MP3 · 320 kbps</option>
          </select>
        </label>
        <button id="dl">⬇ Download master</button>
      </div>
    </div>
  </div>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const val=id=>parseFloat($(id).value);

/* ---------- Slider console definition ---------- */
const SLIDERS=[
  {grp:'Tone (all boosts — nothing is cut)'},
  {id:'strength',label:'Auto EQ fill',    min:0,max:1.5,step:0.05,def:0.8,u:'×'},
  {id:'body',    label:'Body',            min:0,max:6,  step:0.1, def:2.5,u:'dB',hz:110},
  {id:'warmth',  label:'Warmth',          min:0,max:6,  step:0.1, def:1.8,u:'dB',hz:230},
  {id:'presence',label:'Presence',        min:0,max:6,  step:0.1, def:1.5,u:'dB',hz:3000},
  {id:'air',     label:'Air',             min:0,max:6,  step:0.1, def:2.2,u:'dB',hz:9000},
  {grp:'Character & harmonics'},
  {id:'sat',     label:'Saturation',      min:0,max:1,  step:0.02,def:0.35,u:''},
  {id:'exciter', label:'HF exciter',      min:0,max:1,  step:0.02,def:0.2, u:''},
  {id:'octave',  label:'Octave shimmer',  min:0,max:0.5,step:0.01,def:0,   u:'',exp:1},
  {id:'fifth',   label:'Fifth shimmer',   min:0,max:0.5,step:0.01,def:0,   u:'',exp:1},
  {grp:'Dynamics'},
  {id:'punch',   label:'Punch (keep hits)',min:0,max:1, step:0.05,def:0.6, u:''},
  {id:'glueThr', label:'Glue threshold',  min:-40,max:0,step:1,   def:-20, u:'dB'},
  {id:'glueRat', label:'Glue ratio',      min:1,max:4,  step:0.1, def:2.5, u:':1'},
  {grp:'Output'},
  {id:'width',   label:'Stereo width',    min:1,max:1.6,step:0.02,def:1,   u:'×'},
  {id:'lufs',    label:'Loudness target',  min:-24,max:-6,step:0.5,def:-14, u:'LUFS'},
  {id:'ceiling', label:'Peak ceiling',    min:-3,max:-0.1,step:0.1,def:-1, u:'dB'},
];
function buildSliders(){
  const box=$('sliders');box.innerHTML='';
  SLIDERS.forEach(s=>{
    if(s.grp){const d=document.createElement('div');d.className='grp';d.textContent=s.grp;box.appendChild(d);return;}
    const wrap=document.createElement('div');wrap.className='sl';
    const hz=s.hz?` <span style="color:#5b6572">${s.hz>=1000?(s.hz/1000)+'k':s.hz}Hz</span>`:'';
    const exp=s.exp?' <span class="exp">exp.</span>':'';
    wrap.innerHTML=`<label>${s.label}${hz}${exp} <b id="v_${s.id}"></b></label>
      <input type="range" id="${s.id}" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.def}">`;
    box.appendChild(wrap);
    const inp=wrap.querySelector('input');
    const upd=()=>{$('v_'+s.id).textContent=(+inp.value).toFixed(s.step<1?(s.step<0.05?2:1):0)+(s.u?' '+s.u:'');};
    inp.addEventListener('input',upd);upd();
  });
}
function resetSliders(){SLIDERS.forEach(s=>{if(s.id){$(s.id).value=s.def;$(s.id).dispatchEvent(new Event('input'));}});}

/* ---------- FFT (iterative radix-2) ---------- */
function fft(re,im){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]];}}
  for(let len=2;len<=n;len<<=1){
    const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){
      let cr=1,ci=0;
      for(let k=0;k<len/2;k++){
        const ur=re[i+k],ui=im[i+k];
        const vr=re[i+k+len/2]*cr-im[i+k+len/2]*ci;
        const vi=re[i+k+len/2]*ci+im[i+k+len/2]*cr;
        re[i+k]=ur+vr;im[i+k]=ui+vi;
        re[i+k+len/2]=ur-vr;im[i+k+len/2]=ui-vi;
        const ncr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=ncr;
      }
    }
  }
}

/* ---------- Averaged magnitude spectrum ---------- */
function spectrum(mono,sr){
  const N=4096,hop=2048;
  const win=new Float32Array(N);
  for(let i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/(N-1));
  const mag=new Float64Array(N/2);let frames=0;
  for(let s=0;s+N<=mono.length;s+=hop){
    const re=new Float64Array(N),im=new Float64Array(N);
    for(let i=0;i<N;i++)re[i]=mono[s+i]*win[i];
    fft(re,im);
    for(let k=0;k<N/2;k++)mag[k]+=Math.hypot(re[k],im[k]);
    frames++;
  }
  if(frames)for(let k=0;k<N/2;k++)mag[k]/=frames;
  return {mag,N,sr};
}

/* Frequency bands for tonal-balance analysis */
const BANDS=[
  {name:'Sub',      f:40,   lo:20,   hi:60},
  {name:'Bass',     f:100,  lo:60,   hi:160},
  {name:'Low-mid',  f:300,  lo:160,  hi:500},
  {name:'Mid',      f:1000, lo:500,  hi:2000},
  {name:'High-mid', f:3500, lo:2000, hi:6000},
  {name:'Presence', f:9000, lo:6000, hi:12000},
  {name:'Air',      f:15000,lo:12000,hi:20000},
];
/* Target tonal balance (relative dB), gentle pink-ish slope */
const TARGET_DB=[-4,0,-1,-2,-4,-8,-13];

function bandEnergies(spec){
  const {mag,N,sr}=spec;const bins=N/2;const out=[];
  for(const b of BANDS){
    let sum=0,c=0;
    for(let k=1;k<bins;k++){const f=k*sr/N;if(f>=b.lo&&f<b.hi){sum+=mag[k]*mag[k];c++;}}
    const p=c?sum/c:1e-12;
    out.push(10*Math.log10(p+1e-12));
  }
  return out;
}

/* ---------- K-weighting LUFS (ITU-R BS.1770, ~48k coeffs) ---------- */
function biquad(x,b0,b1,b2,a1,a2){
  const y=new Float32Array(x.length);let x1=0,x2=0,y1=0,y2=0;
  for(let i=0;i<x.length;i++){const xi=x[i];const yi=b0*xi+b1*x1+b2*x2-a1*y1-a2*y2;y[i]=yi;x2=x1;x1=xi;y2=y1;y1=yi;}
  return y;
}
function lufs(chs){
  // pre-filter (shelving) + RLB high-pass, coeffs @48k
  const pre=[1.53512485958697,-2.69169618940638,1.19839281085285,-1.69065929318241,0.73248077421585];
  const rlb=[1.0,-2.0,1.0,-1.99004745483398,0.99007225036621];
  let z=0;const L=chs[0].length;
  for(const ch of chs){
    let f=biquad(ch,pre[0],pre[1],pre[2],pre[3],pre[4]);
    f=biquad(f,rlb[0],rlb[1],rlb[2],rlb[3],rlb[4]);
    let s=0;for(let i=0;i<L;i++)s+=f[i]*f[i];
    z+=s/L;
  }
  return -0.691+10*Math.log10(z+1e-12);
}
function truePeakDb(chs){
  let pk=0;for(const ch of chs)for(let i=0;i<ch.length;i++){const a=Math.abs(ch[i]);if(a>pk)pk=a;}
  return 20*Math.log10(pk+1e-12);
}

/* ---------- State ---------- */
let audioBuf=null, analysis=null, mastered=null, actx=null;

/* ---------- Load ---------- */
async function loadFile(file){
  $('status').textContent='Decoding…';
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const arr=await file.arrayBuffer();
  audioBuf=await actx.decodeAudioData(arr);
  $('work').classList.remove('hide');
  $('drop').classList.add('hide');
  $('result').classList.add('hide');
  $('aOrig').src=URL.createObjectURL(file);
  analyze();
  $('status').textContent='';
}

function mixMono(buf){
  const L=buf.length,m=new Float32Array(L);
  for(let c=0;c<buf.numberOfChannels;c++){const d=buf.getChannelData(c);for(let i=0;i<L;i++)m[i]+=d[i];}
  const g=1/buf.numberOfChannels;for(let i=0;i<L;i++)m[i]*=g;return m;
}
function chans(buf){const a=[];for(let c=0;c<buf.numberOfChannels;c++)a.push(buf.getChannelData(c));if(a.length===1)a.push(a[0]);return a;}

function analyze(){
  const mono=mixMono(audioBuf);
  const spec=spectrum(mono,audioBuf.sampleRate);
  const energies=bandEnergies(spec);
  // normalize measured to its Mid band as anchor, target already relative to its Mid
  const anchor=energies[3];
  const rel=energies.map(e=>e-anchor);
  const tgtAnchor=TARGET_DB[3];
  const tgtRel=TARGET_DB.map(t=>t-tgtAnchor);
  const deviation=rel.map((r,i)=>tgtRel[i]-r); // + means boost needed
  analysis={spec,energies,rel,tgtRel,deviation,lufs:lufs(chans(audioBuf)),peak:truePeakDb(chans(audioBuf))};
  drawSpectrum();drawMeters();drawFindings();
}

function drawSpectrum(){
  const cv=$('spec');const dpr=devicePixelRatio||1;
  cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const W=cv.clientWidth,H=cv.clientHeight;ctx.clearRect(0,0,W,H);
  const pad=8;
  const drawCurve=(vals,color,fill)=>{
    ctx.beginPath();
    vals.forEach((v,i)=>{const x=pad+(W-2*pad)*i/(vals.length-1);const y=H-pad-(v+20)/30*(H-2*pad);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.strokeStyle=color;ctx.lineWidth=2.4;ctx.stroke();
  };
  // grid + band labels
  ctx.fillStyle='#8b96a5';ctx.font='10px sans-serif';ctx.textAlign='center';
  BANDS.forEach((b,i)=>{const x=pad+(W-2*pad)*i/(BANDS.length-1);ctx.fillText(b.name,x,H-3);});
  drawCurve(analysis.tgtRel,'#7af0c0');
  drawCurve(analysis.rel,'#4cc2ff');
  if(mastered) drawCurve(mastered.rel,'#ffb454');
}

function drawMeters(){
  const m=$('meters');const a=analysis;
  const cells=[
    {l:'Integrated',v:a.lufs.toFixed(1),u:'LUFS',d:''},
    {l:'True peak',v:a.peak.toFixed(1),u:'dBFS',d:''},
  ];
  if(mastered){
    cells.push({l:'Mastered',v:mastered.lufs.toFixed(1),u:'LUFS',d:'→ target'});
    cells.push({l:'Peak',v:mastered.peak.toFixed(1),u:'dBFS',d:'limited'});
  }
  m.innerHTML=cells.map(c=>`<div class="meter"><div class="l">${c.l}</div><div class="v">${c.v} <span style="font-size:12px;color:var(--mut)">${c.u}</span></div><div class="d">${c.d}</div></div>`).join('');
}

function drawFindings(){
  const el=$('findings');const d=analysis.deviation;const out=[];
  d.forEach((dev,i)=>{
    const b=BANDS[i];
    if(dev>=1.5) out.push(`<div class="finding">Adding <b>${b.name.toLowerCase()}</b> (~${b.f}Hz) — <b>+${Math.min(6,dev*0.7).toFixed(1)} dB</b> to fill it out</div>`);
    else if(dev<=-1.5) out.push(`<div class="finding corr"><b>${b.name}</b> (~${b.f}Hz) already strong — left untouched (no cuts)</div>`);
  });
  out.push(`<div class="finding corr">Plus fixed fullness lift: body (110Hz), warmth (230Hz), presence (3kHz) &amp; air (9kHz+), then glue compression &amp; limiting so nothing peaks.</div>`);
  el.innerHTML=out.join('');
}

/* ---------- Offline render: gentle corrective EQ + warmth + glue comp ----------
   No multiband split (avoids comb-filter/phase artifacts). One in-series signal
   path: broad tonal correction -> warmth low-shelf -> gentle bus "glue". */
async function renderProcessed(){
  const strength=val('strength')*0.7;
  const dev=analysis.deviation;
  const oc=new OfflineAudioContext(audioBuf.numberOfChannels,audioBuf.length,audioBuf.sampleRate);
  const src=oc.createBufferSource();src.buffer=audioBuf;
  let node=src;
  // ADDITIVE auto EQ: only boost bands that sit below target — never cut.
  BANDS.forEach((b,i)=>{
    let gain=Math.max(0,Math.min(6,dev[i]*strength)); // boosts only, clamped 0..6 dB
    if(gain<0.4)return;
    const f=oc.createBiquadFilter();
    if(i===0){f.type='lowshelf';f.frequency.value=70;}
    else if(i===BANDS.length-1){f.type='highshelf';f.frequency.value=11000;}
    else{f.type='peaking';f.frequency.value=b.f;f.Q.value=0.7;}
    f.gain.value=gain;
    node.connect(f);node=f;
  });
  // Manual fullness EQ (all boosts) — driven by the sliders.
  const enh=[
    {type:'peaking',  f:110,  Q:0.7, g:val('body')},
    {type:'peaking',  f:230,  Q:0.8, g:val('warmth')},
    {type:'peaking',  f:3000, Q:0.6, g:val('presence')},
    {type:'highshelf',f:9000, Q:0.7, g:val('air')},
  ];
  enh.forEach(e=>{if(e.g<0.1)return;const f=oc.createBiquadFilter();f.type=e.type;f.frequency.value=e.f;if(e.Q)f.Q.value=e.Q;f.gain.value=e.g;node.connect(f);node=f;});
  // gentle subsonic guard (20Hz) — protects headroom, inaudible, no musical cut
  const hp=oc.createBiquadFilter();hp.type='highpass';hp.frequency.value=20;hp.Q.value=0.5;node.connect(hp);node=hp;
  // Glue compression (parallel). Attack slows with Punch so hits pass first.
  const punch=val('punch');
  const comp=oc.createDynamicsCompressor();
  comp.threshold.value=val('glueThr');comp.ratio.value=val('glueRat');comp.knee.value=10;
  comp.attack.value=0.02+punch*0.045;
  comp.release.value=0.2;
  node.connect(comp);
  const dry=oc.createGain();dry.gain.value=0.3;node.connect(dry);
  const wet=oc.createGain();wet.gain.value=0.85;comp.connect(wet);
  const out=oc.createGain();dry.connect(out);wet.connect(out);
  out.connect(oc.destination);
  src.start();
  return await oc.startRendering();
}

/* ---------- JS post: saturation, width, limiter, loudness ---------- */
function postProcess(buf){
  const sat=val('sat'), width=val('width'), targetLUFS=val('lufs');
  const exc=val('exciter'), octave=val('octave'), fifth=val('fifth');
  const ceilDb=val('ceiling'), sr=buf.sampleRate;
  const n=buf.length;
  const chN=buf.numberOfChannels;
  let l=buf.getChannelData(0).slice();
  let r=chN>1?buf.getChannelData(1).slice():l.slice();

  // Mid/Side stereo width
  if(chN>1 && width!==1){
    for(let i=0;i<n;i++){const m=(l[i]+r[i])*0.5, s=(l[i]-r[i])*0.5*width;l[i]=m+s;r[i]=m-s;}
  }
  // Parallel harmonic saturation (even+odd), blended low with the dry.
  if(sat>0){
    const amt=Math.min(0.5,sat*0.5), drive=1+sat*1.6;
    const sh=x=>{const t=Math.tanh(x*drive)/Math.tanh(drive);return t*0.85+(x*x*Math.sign(x))*0.15;};
    for(let i=0;i<n;i++){l[i]=l[i]*(1-amt)+sh(l[i])*amt;r[i]=r[i]*(1-amt)+sh(r[i])*amt;}
  }
  // HF exciter — generate octave/upper harmonics from the highs and add them back.
  exciteHigh(l,r,sr,exc);
  // Octave-up & fifth-up shimmer layers (granular pitch shift, blended low).
  if(octave>0){const lo=pitchShift(l,2),ro=pitchShift(r,2);for(let i=0;i<n;i++){l[i]+=lo[i]*octave;r[i]+=ro[i]*octave;}}
  if(fifth>0){const rat=Math.pow(2,7/12);const lf=pitchShift(l,rat),rf=pitchShift(r,rat);for(let i=0;i<n;i++){l[i]+=lf[i]*fifth;r[i]+=rf[i]*fifth;}}
  // Transient preservation — lift short bright hits before loudness/limiting.
  transientShape([l,r],sr,val('punch'));
  // Loudness normalization toward target (capped push so the limiter never slams).
  const curLUFS=lufs([l,r]);
  let gainDb=Math.min(9, targetLUFS-curLUFS);
  let gain=Math.pow(10,gainDb/20);
  for(let i=0;i<n;i++){l[i]*=gain;r[i]*=gain;}
  // Brickwall look-ahead limiter to the chosen ceiling.
  limiter([l,r],sr,Math.pow(10,ceilDb/20));
  return {l,r,sr};
}

/* HF exciter — add generated harmonics from a high-passed copy. */
function exciteHigh(l,r,sr,amt){
  if(amt<=0)return;
  const n=l.length, hpCoef=Math.exp(-2*Math.PI*3000/sr);
  const doCh=ch=>{let hpIn=0,hpOut=0;for(let i=0;i<n;i++){const hp=hpCoef*(hpOut+ch[i]-hpIn);hpIn=ch[i];hpOut=hp;
    const harm=Math.tanh(hp*3)*0.5+hp*Math.abs(hp)*0.5; ch[i]+=harm*amt*0.6;}};
  doCh(l);doCh(r);
}

/* WSOLA pitch shifter — time-stretch by ratio (grains phase-aligned to the
   waveform's natural continuation via cross-correlation), then resample by
   1/ratio. Correlation alignment keeps the shift in tune. Tempo preserved. */
function pitchShift(x,ratio){
  const N=x.length, G=1024, Hs=G>>2, Ha=Hs/ratio, seek=Hs>>1;
  const win=new Float32Array(G);for(let i=0;i<G;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/(G-1));
  const M=Math.ceil(N*ratio)+G+seek+4;
  const st=new Float32Array(M), norm=new Float32Array(M);
  let sIn=0,sOut=0,prevTail=null;
  while(sIn+G+seek<N && sOut+G<M){
    let base=Math.floor(sIn), off=0;
    if(prevTail){
      let best=-1e18;
      for(let d=-seek;d<=seek;d++){const b=base+d;if(b<0||b+G>=N)continue;let c=0;for(let k=0;k<G;k+=4)c+=x[b+k]*prevTail[k];if(c>best){best=c;off=d;}}
    }
    const b=base+off;
    for(let k=0;k<G;k++){st[sOut+k]+=x[b+k]*win[k];norm[sOut+k]+=win[k];}
    prevTail=new Float32Array(G);for(let k=0;k<G;k++)prevTail[k]=(b+Hs+k<N)?x[b+Hs+k]:0; // natural continuation
    sIn+=Ha;sOut+=Hs;
  }
  for(let i=0;i<M;i++)if(norm[i]>1e-6)st[i]/=norm[i];
  const out=new Float32Array(N);
  for(let i=0;i<N;i++){const p=i*ratio,i0=Math.floor(p),f=p-i0;out[i]=(st[i0]||0)*(1-f)+(st[i0+1]||0)*f;}
  return out;
}

/* Transient shaper — lifts short high-frequency attacks (e.g. wood-block snare)
   so hits cut through the fullness boosts and glue comp instead of being buried.
   Detection runs on a high-passed signal so it triggers on bright hits, not bass. */
function transientShape(chs,sr,amount){
  if(amount<=0)return;
  const n=chs[0].length;
  const hpCoef=Math.exp(-2*Math.PI*1800/sr);           // detect content above ~1.8kHz
  const aFast=Math.exp(-1/(sr*0.0008)), rFast=Math.exp(-1/(sr*0.02));
  const aSlow=Math.exp(-1/(sr*0.02)),   rSlow=Math.exp(-1/(sr*0.15));
  let hpIn=0,hpOut=0, ef=0, es=0;
  const gain=new Float32Array(n);
  const c1=chs[0], c2=chs[1]||chs[0];
  for(let i=0;i<n;i++){
    const mono=(c1[i]+c2[i])*0.5;
    const hp=hpCoef*(hpOut+mono-hpIn); hpIn=mono; hpOut=hp; // one-pole high-pass
    const x=Math.abs(hp);
    ef = x>ef ? aFast*ef+(1-aFast)*x : rFast*ef+(1-rFast)*x; // fast follower
    es = x>es ? aSlow*es+(1-aSlow)*x : rSlow*es+(1-rSlow)*x; // slow follower
    const trans=Math.max(0,(ef-es)/(es+1e-4));               // attack "amount"
    gain[i]=1+amount*Math.min(2.5,trans);                    // boost only on attacks
  }
  // apply (broadband boost during detected high-freq attacks)
  for(let i=0;i<n;i++){c1[i]*=gain[i];c2[i]*=gain[i];}
  if(chs[1]&&chs[1]!==chs[0]){/* c2 already chs[1] */}
}

function limiter(chs,sr,ceil){
  const n=chs[0].length;
  const look=Math.max(1,Math.round(sr*0.002)); // 2ms lookahead
  const rel=Math.exp(-1/(sr*0.12)); // slower release -> smoother, less pumping
  let env=0;
  // compute gain envelope from delayed peak detection
  const gains=new Float32Array(n).fill(1);
  for(let i=0;i<n;i++){
    let peak=0;
    for(const ch of chs){const a=Math.abs(ch[Math.min(n-1,i+look)]);if(a>peak)peak=a;}
    let want=peak>ceil?ceil/peak:1;
    if(want<env)env=want; else env=env*rel+want*(1-rel);
    gains[i]=env;
  }
  // apply with lookahead delay
  for(const ch of chs){
    const d=ch.slice();
    for(let i=0;i<n;i++){const gi=gains[Math.max(0,i-look)];ch[i]=d[i]*gi;}
  }
}

/* ---------- WAV encode ---------- */
function encodeWAV(l,r,sr){
  const n=l.length,ch=2,bps=16;
  const buf=new ArrayBuffer(44+n*ch*2);const v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+n*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,bps,true);
  ws(36,'data');v.setUint32(40,n*ch*2,true);
  let o=44;for(let i=0;i<n;i++){for(const s of [l[i],r[i]]){let x=Math.max(-1,Math.min(1,s));v.setInt16(o,x<0?x*0x8000:x*0x7fff,true);o+=2;}}
  return new Blob([buf],{type:'audio/wav'});
}

/* ---------- MP3 encode (lamejs) ---------- */
function encodeMP3(l,r,sr){
  if(typeof lamejs==='undefined')throw new Error('MP3 encoder not loaded');
  const enc=new lamejs.Mp3Encoder(2,sr,320);
  const n=l.length, BL=1152, li=new Int16Array(n), ri=new Int16Array(n);
  for(let i=0;i<n;i++){li[i]=Math.max(-1,Math.min(1,l[i]))*32767;ri[i]=Math.max(-1,Math.min(1,r[i]))*32767;}
  const data=[];
  for(let i=0;i<n;i+=BL){const lc=li.subarray(i,i+BL),rc=ri.subarray(i,i+BL);const buf=enc.encodeBuffer(lc,rc);if(buf.length)data.push(new Int8Array(buf));}
  const end=enc.flush();if(end.length)data.push(new Int8Array(end));
  return new Blob(data,{type:'audio/mp3'});
}

/* ---------- Master action ---------- */
async function doMaster(){
  $('master').disabled=true;$('progwrap').classList.remove('hide');
  const step=(p,t)=>{$('prog').style.width=p+'%';$('status').textContent=t;};
  step(15,'Applying EQ, fullness & glue compression…');
  await new Promise(r=>setTimeout(r,30));
  const rendered=await renderProcessed();
  step(55,'Saturation, stereo, limiting & loudness…');
  await new Promise(r=>setTimeout(r,30));
  const {l,r,sr}=postProcess(rendered);
  step(80,'Measuring & encoding…');
  // re-analyze mastered spectrum
  const mono=new Float32Array(l.length);for(let i=0;i<l.length;i++)mono[i]=(l[i]+r[i])*0.5;
  const mspec=spectrum(mono,sr);const men=bandEnergies(mspec);
  const anchor=men[3];const mrel=men.map(e=>e-anchor);
  mastered={l,r,sr,rel:mrel,lufs:lufs([l,r]),peak:truePeakDb([l,r])};
  const blob=encodeWAV(l,r,sr);mastered.blob=blob;
  $('aMast').src=URL.createObjectURL(blob);
  drawSpectrum();drawMeters();
  step(100,'Done ✓');
  $('result').classList.remove('hide');
  setTimeout(()=>{$('progwrap').classList.add('hide');$('prog').style.width='0';},600);
  $('master').disabled=false;
}

/* ---------- Wiring ---------- */
const drop=$('drop');
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('hover');}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('hover');}));
drop.addEventListener('drop',ev=>{if(ev.dataTransfer.files[0])loadFile(ev.dataTransfer.files[0]);});
$('pick').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0]);});
$('master').addEventListener('click',doMaster);
$('reset').addEventListener('click',()=>{$('drop').classList.remove('hide');$('work').classList.add('hide');mastered=null;});
$('resetSliders').addEventListener('click',resetSliders);
$('auto').addEventListener('click',()=>{
  if(!analysis)return;
  // Fill fullness sliders from where the track is weakest vs target.
  const d=analysis.deviation; // +ve = lacking
  const pick=(lo,hi,base)=>Math.max(0,Math.min(6,base+ (d.slice(lo,hi).reduce((a,b)=>a+b,0)/(hi-lo))*0.6));
  $('body').value=pick(0,2,2).toFixed(1);
  $('warmth').value=pick(2,3,1.5).toFixed(1);
  $('presence').value=pick(4,5,1.2).toFixed(1);
  $('air').value=pick(5,7,1.8).toFixed(1);
  $('strength').value=0.8;$('sat').value=0.35;$('exciter').value=0.2;$('punch').value=0.6;
  SLIDERS.forEach(s=>{if(s.id)$(s.id).dispatchEvent(new Event('input'));});
  $('status').textContent='Sliders set from analysis — tweak, then Render master.';
});
$('dl').addEventListener('click',()=>{
  if(!mastered)return;
  const fmt=$('fmt').value;
  let blob,ext;
  try{
    if(fmt==='mp3'){$('status').textContent='Encoding MP3…';blob=encodeMP3(mastered.l,mastered.r,mastered.sr);ext='mp3';}
    else{blob=encodeWAV(mastered.l,mastered.r,mastered.sr);ext='wav';}
  }catch(e){$('status').textContent='MP3 encoder unavailable (offline?) — exported WAV instead.';blob=encodeWAV(mastered.l,mastered.r,mastered.sr);ext='wav';}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mastered.'+ext;a.click();
  $('status').textContent='Exported mastered.'+ext;
});
window.addEventListener('resize',()=>{if(analysis)drawSpectrum();});
buildSliders();
</script>
